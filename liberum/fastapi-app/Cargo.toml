[package]
name = "fastapi-app"
version = "0.1.0"
publish = false
edition = "2024"

[workspace]

[features]
# LEGACY_LINUX: build for Linux kernels older than 5.3 (AlmaLinux 8's 4.18),
# which have no pidfd for watching worker processes:
#   ./scripts/build.sh --features legacy-linux
legacy-linux = ["gufi/legacy-linux"]

[dependencies]
claviron = { version = "=0.2.0-alpha.18", default-features = false, features = ["server", "orbit"] }
# The sibling edge-server owns HTTP ingress; this application serves Orbit.
gufi = { version = "=0.1.0-alpha.2", features = ["axum", "cli", "websocket"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
tracing = "0.1.44"

# Match claviron-full's dev profile. Without this the default is
# `opt-level = 0` while the edge builds at 1, and a transport measurement
# between the two compares an optimised server against an unoptimised
# application — with this crate's own transport code paying for it twice.
[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

# The edge's release settings, so both ends of a measurement are built alike —
# `servers/edge-server/BENCHMARK.md` voids a comparison otherwise — except
# `strip`: a profiler needs the symbols to name the Rust frames.
[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
