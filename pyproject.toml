[project]
name = "claviron"
version = "0.2.0-alpha.18"
description = "Local development tools for the Claviron Rust repository"
requires-python = ">=3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=0.60.0",
]
test = [
    "pytest",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "httpx[http2]>=0.28.1",
]
bench = [
    "scipy>=1.17.1",
]

# This name identifies a local tool environment, not Gufi's native Python module.
[tool.uv]
package = false

# Local release artifacts and receipts; never part of a registry package.
[tool.claviron.publish]
state-directory = "target/publisher"

# Composer distribution mirrors are generated from committed package snapshots.
# These paths are local tooling inputs, never published package metadata.
[tool.claviron.composer]
state-directory = "target/composer"

[[tool.claviron.composer.packages]]
name = "claviron/sapi"
remote = "https://github.com/claviron/php-sapi.git"
repository = "."
directory = "crates/php-embed/php"
license = "LICENSE-MIT"
include = ["composer.json", "README.md", "src", "fallback"]

[[tool.claviron.composer.packages]]
name = "claviron/laravel"
remote = "https://github.com/claviron/php-laravel.git"
repository = "../lumenize"
directory = "php"
license = "LICENSE"
include = ["composer.json", "README.md", "src", "config", "runners", "stubs"]
