[package]
autotests = false
name = "claviron-php-fcgi"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "PHP-FPM FastCGI gateway with connection pooling and streaming responses for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["php", "fastcgi", "php-fpm", "gateway", "claviron"]
categories = ["web-programming::http-server", "network-programming", "asynchronous"]

[features]
default = []
axum = ["dep:axum"]
metrics = ["dep:claviron-metrics", "dep:serde_json", "orbitive/metrics"]
tasks = ["dep:claviron-tasks", "dep:futures"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["axum", "server"] }
claviron-metrics = { workspace = true, optional = true }
claviron-orbit.workspace = true
claviron-php = { workspace = true, features = ["php_fcgi"] }
claviron-runtime.workspace = true
claviron-tasks = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures = { workspace = true, optional = true }
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json = { workspace = true, optional = true }

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── PHP / FFI ───────────────────────────────────────────────────────────
# FastCGI wire requests, response streams and persistent backend connections.
fastcgi-client.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true
