[package]
name = "claviron-hyper"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Native Hyper-based HTTP/1.1 and HTTP/2 TCP transport for the Claviron edge"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "http2", "hyper", "server", "claviron"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = ["tls"]
tls = ["dep:claviron-tls", "dep:tokio-rustls"]
acme = ["claviron-edge/acme"]
metrics = ["claviron-http/metrics", "claviron-edge/metrics"]
geoip = ["dep:claviron-geoip"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-edge = { workspace = true, features = ["server", "axum"] }
claviron-geoip = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-runtime.workspace = true
claviron-sys.workspace = true
claviron-tls = { workspace = true, optional = true }
claviron-types = { workspace = true, features = ["ssl"] }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
tokio-rustls = { workspace = true, optional = true }

# ── System / OS bindings ────────────────────────────────────────────────
socket2 = { workspace = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["test-util"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
h2 = "0.4"

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rcgen.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
