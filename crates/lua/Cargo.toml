[package]
autotests = false
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/README.md",
    "/lua/*.lua",
    "/lua/*.LICENSE",
]
name = "claviron-lua"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Lua 5.5 embedded in Claviron: a fresh sandboxed state per script, extended from Rust"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["lua", "scripting", "interpreter", "embedding", "async"]
categories = ["web-programming::http-server", "asynchronous"]

[[test]]
name = "process_api"
path = "tests/runtime/process_api.rs"
required-features = ["server"]
# Initializes Lua explicitly; keep it outside the routine library test run.
test = false

[features]
default = []
# A host's configuration: `lua.yaml`'s search path, read at boot and reload.
server = ["dep:async-trait", "dep:claviron-runtime", "dep:serde", "dep:serde_yaml"]
# The fleet's shared state as Lua modules: `claviron.orbit.cell`, …
orbit = ["dep:claviron-orbit", "dep:claviron-app", "server"]
# `claviron.log`: records to the log channels `logging.yaml` declares.
log = ["dep:claviron-logging", "claviron-logging/pipeline"]
# `claviron.fetch`: HTTP out, to the hosts `lua.yaml` allows.
fetch = ["dep:reqwest", "server"]
# Applications: `lua.yaml`'s `applications:`, loaded once per worker.
app = ["server", "dep:bytes", "dep:claviron-app", "dep:claviron-helpers", "dep:claviron-http", "dep:http", "dep:http-body", "dep:http-body-util"]
# WebSockets for applications: `websocket:` on a `lua:` route, over an
# HTTP/1.1 Upgrade or an HTTP/2 extended CONNECT.
websocket = ["app", "dep:fastwebsockets", "dep:hyper", "dep:hyper-util"]
# Reliable WebTransport streams reuse the fleet's bounded message codec.
webtransport = ["app", "dep:claviron-orbit", "dep:futures-util"]
# Shared SQL dependencies; adapters require `postgres`, `mysql` or `sqlite`.
db = ["server", "dep:claviron-db", "claviron-db/server", "dep:futures-util", "dep:sqlx", "sqlx/json"]
# `claviron.db.mysql`, on the MySQL pools.
mysql = ["db", "claviron-db/mysql", "sqlx/mysql"]

postgres = ["db", "claviron-db/postgres", "sqlx/postgres"]

sqlite = ["db", "claviron-db/sqlite", "sqlx/sqlite", "dep:sqlx-core"]
# `lua:` tasks in Claviron's task service.
tasks = ["dep:claviron-tasks", "server"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app = { workspace = true, optional = true }
claviron-db = { workspace = true, default-features = false, optional = true }
claviron-helpers = { workspace = true, optional = true }
claviron-http = { workspace = true, optional = true }
claviron-logging = { workspace = true, optional = true }
claviron-orbit = { workspace = true, optional = true }
claviron-runtime = { workspace = true, optional = true }
claviron-tasks = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, optional = true }
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }

# ── HTTP core ───────────────────────────────────────────────────────────
fastwebsockets = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
# Method-specific route lookup for Lua applications.
matchit = "0.9"
# Outbound claviron.fetch requests under the configured host policy.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"], optional = true }

# ── PHP / FFI ───────────────────────────────────────────────────────────
# Pinned by minor: every minor release so far has changed the API. `vendored`
# builds Lua 5.5 from source into the binary, so every host runs one build.
mlua = { version = "0.12", features = ["lua55", "vendored", "async", "send", "serde"] }

# ── Database / cache backends ───────────────────────────────────────────
sqlx = { workspace = true, optional = true }
# The facade does not re-export TransactionManager. Use SQLx's own transaction
# machinery while retaining the pool lease for error-only connection retirement.
sqlx-core = { version = "0.9", default-features = false, optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes = { workspace = true, optional = true }
regex.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt"] }
