[package]
name = "claviron-logging"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Process diagnostics and fleet-buffered log channels for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["claviron", "logging", "tracing", "observability", "otlp"]
categories = ["development-tools::debugging", "asynchronous"]
# Tests live under tests/ and are included by their modules.
autotests = false

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
# Fleet log channels use an Orbit ring with a single writer.
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_yaml.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
time.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
# The OTLP channel adapter: OpenTelemetry's logs bridge and its OTLP/HTTP
# exporter, with reqwest's blocking client and no TLS features (http only).
opentelemetry = { version = "0.33", default-features = false, features = ["logs"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"], optional = true }
thiserror.workspace = true
tracing.workspace = true
# System journal output for the configured tracing sink.
tracing-journald.workspace = true
tracing-subscriber.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes = { workspace = true, optional = true }

# ── Published sibling libraries shared through workspace dependencies ───
orbitive = { workspace = true, optional = true }

[dev-dependencies]
# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[features]
otlp = ["pipeline", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
pipeline = [
    "dep:async-trait",
    "dep:bytes",
    "dep:claviron-orbit",
    "dep:orbitive",
    "dep:serde_json",
    "dep:tokio",
]
