[package]
name = "claviron-logging"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Process diagnostics and fleet-buffered log channels for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["claviron", "logging", "tracing", "observability", "otlp"]
categories = ["development-tools::debugging", "asynchronous"]
# Tests live under tests/ and are included by their modules.
autotests = false

[dependencies]
arc-swap.workspace = true
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
tracing-subscriber.workspace = true
tracing-journald.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true
# The system log's block of logging.yaml.
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
serde.workspace = true
serde_yaml.workspace = true

# The log pipeline: channels from logging.yaml, an Orbit ring, one writer.
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
claviron-orbit = { version = "0.2.0-alpha.17", path = "../orbit", optional = true }
orbitive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# The OTLP channel adapter: OpenTelemetry's logs bridge and its OTLP/HTTP
# exporter, with reqwest's blocking client and no TLS features (http only).
opentelemetry = { version = "0.33", default-features = false, features = ["logs"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
otlp = ["pipeline", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
pipeline = [
    "dep:async-trait",
    "dep:bytes",
    "dep:claviron-orbit",
    "dep:orbitive",
    "dep:serde_json",
    "dep:tokio",
]
