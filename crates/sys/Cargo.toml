[package]
autotests = false
name = "claviron-sys"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Native socket, process identity, and OS primitives for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["process", "sockets", "unix", "system"]
categories = ["os::unix-apis", "network-programming"]

[features]
# LEGACY_LINUX: run on Linux kernels older than 5.3 (AlmaLinux 8's 4.18), which
# have no pidfd. Off by default: a kernel with pidfd never needs it, and one
# without it fails at the first process handle and names this feature.
legacy-linux = []

[dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
# Stable filesystem lock names derived from process identity names.
blake3.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
hostname.workspace = true
socket2.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# Unix-only: kinfo_proc (FreeBSD), task_info (macOS), procfs paths.
[target.'cfg(unix)'.dependencies]
# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true

[dev-dependencies]
# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
