[package]
autotests = false
name = "claviron-bench"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Opt-in native HTTP benchmark handlers and edge/runner registrations for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["benchmark", "http", "claviron"]
categories = ["development-tools::profiling", "web-programming::http-server"]

[features]
default = []
edge = ["dep:claviron-edge", "claviron-edge/axum", "dep:async-trait"]
runner = ["claviron-http/routing"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-edge = { workspace = true, optional = true, default-features = false }
claviron-http = { workspace = true, features = ["axum"] }
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true
