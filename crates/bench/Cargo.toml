[package]
autotests = false
name = "claviron-bench"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Opt-in native HTTP benchmark handlers and edge/runner registrations for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["benchmark", "http", "claviron"]
categories = ["development-tools::profiling", "web-programming::http-server"]

[features]
default = []
edge = ["dep:claviron-edge", "claviron-edge/axum", "dep:async-trait"]
runner = ["claviron-http/routing"]

[dependencies]
claviron-edge = { version = "0.2.0-alpha.17", path = "../edge", optional = true, default-features = false }
claviron-http = { version = "0.2.0-alpha.17", path = "../http", features = ["axum"] }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
async-trait = { workspace = true, optional = true }
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
