[package]
autotests = false
name = "claviron-app"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
description = "Runtime-qualified application identity, control, status, and events for Claviron"
keywords = ["application", "lifecycle", "events", "runtime", "async"]
categories = ["asynchronous", "concurrency"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-orbit.workspace = true
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
uuid = { workspace = true, features = ["v4"] }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt", "time"] }
