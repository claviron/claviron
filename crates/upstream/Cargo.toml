[package]
autotests = false
name = "claviron-upstream"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "HTTP reverse proxying, origin pools, and upstream lifecycle for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["proxy", "http", "upstream", "load-balancing", "async"]
categories = ["web-programming::http-server", "web-programming::http-client", "network-programming", "asynchronous"]

[features]
default = []

metrics = ["claviron-runtime/metrics", "orbitive/metrics"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-macros.workspace = true
claviron-orbit.workspace = true
# Contracts only; the application binds the resolver (`dyn ResolverFactory`).
claviron-resolver = { workspace = true, default-features = false }
claviron-runtime.workspace = true
claviron-sys.workspace = true
claviron-tls = { workspace = true, default-features = false }
# TLS transport and certificate trust. Certificate material is the process
# certificate manager's; this crate holds no certificate directory of its own.
claviron-types = { workspace = true, features = ["ssl"] }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
pin-project-lite.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
hyper.workspace = true
# Only protocol connections and Tokio adapters; no client-legacy pooling (I20).
hyper-util.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rustls.workspace = true
# Native system trust roots for upstream TLS connections.
rustls-native-certs.workspace = true
tokio-rustls.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
blake3.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true

# ── Networking utilities ────────────────────────────────────────────────
url.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
humantime.workspace = true
humantime-serde.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true
regex.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive.workspace = true
