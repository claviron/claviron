[package]
name = "claviron-php-embed"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Managed in-process PHP execution, application hosting, and native extensions for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/README.md",
    "/build.rs",
    "/php/composer.json",
    "/php/src/**/*.php",
    "/php/fallback/*.php",
]
keywords = ["php", "embedded", "sapi", "runtime", "claviron"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
build = "build.rs"
# tests/supervisor.rs is included as a private unit-test module.
# Declare future integration tests explicitly with [[test]].
autotests = false

[features]
default = ["opcache-intercept"]
# APCu hooks are opt-in; OPcache propagation stays enabled for persistent
# applications and multi-worker execution. Neither feature is facade-forwarded.
apcu-intercept = []
opcache-intercept = []
metrics = ["dep:claviron-metrics", "orbitive/metrics"]
axum = ["dep:axum", "claviron-http/axum"]
tasks = ["dep:claviron-tasks"]
cache = ["dep:claviron-cache"]
auth = ["dep:claviron-auth", "dep:uuid"]
# claviron_log_channel() / claviron_log(): records to the log channels
# logging.yaml declares, through the fleet's log ring.
log-pipeline = ["dep:claviron-logging", "claviron-logging/pipeline"]
mysql = [
    "dep:claviron-db",
    "claviron-db/server",
    "claviron-db/mysql",
    "dep:sqlx",
    "dep:time",
]
postgres = [
    "dep:claviron-db",
    "claviron-db/server",
    "claviron-db/postgres",
    "dep:sqlx",
    "dep:time",
]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-auth = { workspace = true, features = ["orbit"], optional = true }
claviron-cache = { workspace = true, optional = true }
claviron-db = { workspace = true, default-features = false, optional = true }
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-logging = { workspace = true, optional = true }
claviron-metrics = { workspace = true, optional = true }
claviron-orbit.workspace = true
claviron-php = { workspace = true, features = ["php_embed"] }
claviron-runtime.workspace = true
claviron-tasks = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── PHP / FFI ───────────────────────────────────────────────────────────
# Embedded PHP lifecycle, Zend value conversion and native registrations.
ext-php-rs.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
fastrand.workspace = true

# ── Database / cache backends ───────────────────────────────────────────
sqlx = { workspace = true, optional = true }

# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
# Date/time construction for the PostgreSQL type layer; same 0.3 line sqlx uses.
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true
regex.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
congif.workspace = true
orbitive.workspace = true

[dev-dependencies]
# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "native_registration"
