[package]
autotests = false
name = "claviron-db"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Typed database configuration and reloadable SQLx pools for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["database", "sqlx", "postgres", "mysql", "sqlite"]
categories = ["database", "asynchronous"]

[features]
default = ["sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# SQLite files: data one host keeps for itself, shared by its processes.
sqlite = ["sqlx/sqlite"]
server = [
    "dep:claviron-runtime",
    "dep:async-trait",
    "dep:arc-swap",
]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-runtime = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── Database / cache backends ───────────────────────────────────────────
sqlx = { workspace = true }

# ── Networking utilities ────────────────────────────────────────────────
url.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
