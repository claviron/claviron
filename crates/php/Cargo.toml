[package]
autotests = false
name = "claviron-php"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared PHP route configuration and runtime contracts for Claviron execution backends"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["php", "runtime", "fastcgi", "sapi"]
categories = ["web-programming::http-server", "config", "asynchronous"]

[features]
default = []
php_embed = []
php_fcgi = []

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-helpers.workspace = true
claviron-http.workspace = true
claviron-runtime.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true
