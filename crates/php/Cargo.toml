[package]
autotests = false
name = "claviron-php"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared PHP route configuration and runtime contracts for Claviron execution backends"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["php", "runtime", "fastcgi", "claviron"]
categories = ["web-programming::http-server", "config", "asynchronous"]

[features]
default = []
axum = ["dep:axum"]
php_embed = []
php_fcgi = []

[dependencies]
claviron-app = { version = "0.2.0-alpha.17", path = "../app" }
axum = { workspace = true, optional = true }
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
claviron-http = { version = "0.2.0-alpha.17", path = "../http" }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
http.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
