[package]
autotests = false
name = "claviron-pusher"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Pusher-compatible wire messages, signing, and target configuration for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["pusher", "websocket", "realtime", "broadcast", "protocol"]
categories = ["web-programming::websocket", "network-programming"]

[features]
default = []
http = [
    "dep:claviron-http",
    "claviron-http/server",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tracing",
]
axum = ["http", "dep:axum", "claviron-http/axum"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-http = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, optional = true }

# ── Serialization & parsing ─────────────────────────────────────────────
hex.workspace = true
hmac.workspace = true
# Pusher body_md5 payload digest; request signatures use HMAC-SHA256.
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── Networking utilities ────────────────────────────────────────────────
url.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-runtime.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[[test]]
name = "lifecycle"
required-features = ["http"]
