[package]
autotests = false
name = "claviron-pusher"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Pusher-compatible wire messages, signing, and target configuration for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["claviron", "pusher", "websocket", "realtime", "broadcast"]
categories = ["network-programming", "web-programming::http-server"]

[features]
default = []
http = [
    "dep:claviron-http",
    "claviron-http/server",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tracing",
]
axum = ["http", "dep:axum", "claviron-http/axum"]

[dependencies]
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
claviron-http = { version = "0.2.0-alpha.17", path = "../http", optional = true }

axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
hex.workspace = true
hmac.workspace = true
hyper-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
bytes.workspace = true
serde_yaml.workspace = true

[[test]]
name = "lifecycle"
required-features = ["http"]
