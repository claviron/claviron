[package]
autotests = false
name = "claviron-supervisor"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Worker process supervision, recovery, rolling restart, and fleet management for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["supervisor", "workers", "process", "claviron"]
categories = ["concurrency", "asynchronous"]

[features]
metrics = ["dep:claviron-metrics", "dep:orbitive"]

[dependencies]
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
claviron-metrics = { version = "0.2.0-alpha.17", path = "../metrics", optional = true }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
claviron-orbit = { version = "0.2.0-alpha.17", path = "../orbit" }
claviron-sys = { version = "0.2.0-alpha.17", path = "../sys" }
orbitive = { workspace = true, features = ["metrics"], optional = true }
arc-swap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_yaml.workspace = true
nix.workspace = true
humantime.workspace = true
tracing.workspace = true
thiserror.workspace = true
byte-unit.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
