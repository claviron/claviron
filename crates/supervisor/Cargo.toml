[package]
autotests = false
name = "claviron-supervisor"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Worker process supervision, recovery, rolling restart, and fleet management for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["supervisor", "workers", "process", "claviron"]
categories = ["concurrency", "asynchronous"]

[features]
metrics = ["dep:claviron-metrics", "dep:orbitive"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-metrics = { workspace = true, optional = true }
claviron-orbit.workspace = true
claviron-runtime.workspace = true
claviron-sys.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
nix.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
humantime.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
byte-unit.workspace = true
bytes.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive = { workspace = true, features = ["metrics"], optional = true }

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["test-util"] }
