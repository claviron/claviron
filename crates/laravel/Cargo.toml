[package]
name = "claviron-laravel"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Native Laravel adapters for Claviron authentication, broadcasting, configuration, and console execution"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/php/tests/**",
    "/README.md",
    "/php/composer.json",
    "/php/README.md",
    "/php/src/**/*.php",
    "/php/config/*.php",
    "/php/runners/*.php",
    "/php/stubs/*.php",
]
keywords = ["laravel", "php", "embedded", "runtime", "claviron"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
autotests = false

[dependencies]
claviron-auth = { version = "0.2.0-alpha.17", path = "../auth" }
claviron-app = { version = "0.2.0-alpha.17", path = "../app" }
arc-swap.workspace = true
claviron-php-embed = { version = "0.2.0-alpha.17", path = "../php-embed" }
claviron-pusher = { version = "0.2.0-alpha.17", path = "../pusher" }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
claviron-broadcast = { version = "0.2.0-alpha.17", path = "../broadcast" }
ext-php-rs.workspace = true
congif.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
claviron-http = { version = "0.2.0-alpha.17", path = "../http" }
claviron-php = { version = "0.2.0-alpha.17", path = "../php", features = ["php_embed"] }
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true

[[test]]
name = "native_registration"
