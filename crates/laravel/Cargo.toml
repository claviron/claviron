[package]
name = "claviron-laravel"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Native Laravel adapters for Claviron authentication, broadcasting, configuration, and console execution"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "/src/**/*.rs",
    "/tests/**",
    "/php/tests/**",
    "/README.md",
    "/php/composer.json",
    "/php/README.md",
    "/php/src/**/*.php",
    "/php/config/*.php",
    "/php/runners/*.php",
    "/php/stubs/*.php",
]
keywords = ["laravel", "php", "embedded", "runtime", "claviron"]
categories = ["web-programming::http-server", "api-bindings", "asynchronous"]
autotests = false

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-auth.workspace = true
claviron-broadcast.workspace = true
claviron-php-embed.workspace = true
claviron-pusher.workspace = true
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde_json.workspace = true

# ── PHP / FFI ───────────────────────────────────────────────────────────
ext-php-rs.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
time.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
congif.workspace = true

[dev-dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-http.workspace = true
claviron-php = { workspace = true, features = ["php_embed"] }

# ── Async runtime & primitives ──────────────────────────────────────────
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body-util.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "native_registration"
