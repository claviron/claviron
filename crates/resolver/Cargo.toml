[package]
name = "claviron-resolver"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared DNS resolution contracts and an optional Hickory driver for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["dns", "resolver", "hickory", "async"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
hickory = ["dep:hickory-resolver", "dep:tokio"]

[dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["sync"], optional = true }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }

# ── Networking utilities ────────────────────────────────────────────────
# Opt-in DNS driver; the application explicitly binds its resolver factory.
hickory-resolver = { workspace = true, optional = true, features = ["system-config", "tokio"] }

# ── Time / identifiers ──────────────────────────────────────────────────
# Human-readable DNS timeouts and cache TTLs in configuration.
humantime-serde.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true
