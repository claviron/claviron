[package]
autotests = false
name = "claviron-types"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Shared host identities and optional certificate primitives for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["hostname", "certificates", "tls", "claviron"]
categories = ["network-programming", "cryptography"]

[features]
default = []
ssl = [
    "dep:base64ct",
    "dep:dirs",
    "dep:fastrand",
    "dep:rcgen",
    "dep:rustls",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:thiserror",
    "dep:time",
    "dep:x509-parser",
]

[dependencies]
serde.workspace = true
base64ct = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
fastrand = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true, features = ["verify-aws"] }
