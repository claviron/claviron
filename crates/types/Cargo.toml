[package]
autotests = false
name = "claviron-types"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared host identities and optional certificate primitives for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["hostname", "certificates", "tls"]
categories = ["network-programming", "cryptography"]

[features]
default = []
ssl = [
    "dep:base64ct",
    "dep:dirs",
    "dep:fastrand",
    "dep:rcgen",
    "dep:rustls",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:thiserror",
    "dep:time",
    "dep:x509-parser",
]

[dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }

# ── TLS / certificates ──────────────────────────────────────────────────
# Certificate, CA and CSR generation.
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# Certificate/CSR parsing and certificate signature checks.
x509-parser = { workspace = true, optional = true, features = ["verify-aws"] }

# ── Crypto / hashing / encoding ─────────────────────────────────────────
base64ct = { workspace = true, optional = true }
fastrand = { workspace = true, optional = true }

# ── System / OS bindings ────────────────────────────────────────────────
dirs = { workspace = true, optional = true }

# ── Time / identifiers ──────────────────────────────────────────────────
time = { workspace = true, optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror = { workspace = true, optional = true }

[[test]]
name = "host_parse"
path = "tests/host.rs"
