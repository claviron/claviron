[package]
name = "claviron-orbit"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Claviron lifecycle bindings for Orbitive shared memory, events, locks, counters, and application transport"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["shared-memory", "ipc", "events", "concurrency", "async"]
categories = ["concurrency", "asynchronous"]
# `tests/event.rs`, `tests/counter.rs`, and `tests/registry.rs` are private
# unit-test modules included from `src`. Declare real integration tests below.
autotests = false

[features]
default = []
quota = ["orbitive/quota"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
humantime-serde.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
continuo = { workspace = true, features = ["fleet"] }
orbitive = { workspace = true, features = ["arena", "cache", "cell", "events", "lock", "counter", "invoke-tokio", "link-tokio", "link-events", "stream-tokio"] }

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true
nix.workspace = true
tempfile = "3"

[[test]]
name = "counter_shm"
path = "tests/counter_shm.rs"
