[package]
autotests = false
name = "claviron-pipeline"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "The request execution contract for Claviron: what an application or embedded runtime implements, independent of hosts and listeners"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "pipeline", "backend"]
categories = ["web-programming::http-server", "asynchronous"]

[features]
default = []
# One access record per request, to the log channel logging.yaml names.
access-log = ["dep:claviron-logging", "claviron-logging/pipeline"]
# Optional Rust application adapter.
axum = ["dep:axum", "claviron-http/axum"]
metrics = ["claviron-http/metrics"]
# H1 upgrades answered by endpoints a host registered, ahead of its applications.
websocket = ["claviron-http/websocket"]
warp = ["claviron-http/warp"]
# Link routes, and dispatch to the application process each one names.
orbit = [
    "claviron-http/orbit",
    "claviron-http/websocket",
    "dep:claviron-orbit",
    "dep:fastwebsockets",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:tokio",
    "tokio-util/io",
]
# Admission quotas declared by a site or route.
rate-limit = ["claviron-http/rate-limit", "dep:claviron-orbit", "claviron-orbit/quota"]

[dependencies]
claviron-files.workspace = true
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-logging = { workspace = true, optional = true }
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-types.workspace = true

async-trait.workspace = true
axum = { workspace = true, optional = true }
bytes.workspace = true
fastwebsockets = { workspace = true, optional = true }
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
percent-encoding = { workspace = true, optional = true }
regex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
