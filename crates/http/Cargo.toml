[package]
autotests = false
name = "claviron-http"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared HTTP types, request policy, configuration, and routing contracts for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "routing", "middleware", "websocket", "async"]
categories = ["web-programming::http-server", "web-programming::websocket", "asynchronous", "network-programming"]

[features]
default = []
rate-limit = ["dep:claviron-orbit", "claviron-orbit/quota"]
# Route declarations only; these do not enable execution engines or drivers.
js = []
lua = []
orbit = []
acme = []
http3 = []
server = ["dep:arc-swap", "dep:claviron-tls", "dep:rustls", "dep:futures-util"]
metrics = ["axum", "claviron-runtime/metrics", "dep:claviron-orbit", "dep:orbitive", "orbitive/metrics"]
cache = ["axum", "dep:claviron-cache"]
axum = ["dep:axum", "dep:headers", "dep:serde_json"]
routing = ["axum", "dep:serde_yaml"]
websocket = ["server", "axum", "dep:hyper", "dep:sha1"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-cache = { workspace = true, optional = true }
# Not optional: the watchdog is a runtime organ, not a metric, and it parses
# its own durations from configuration like everything else here.
claviron-helpers.workspace = true
claviron-macros.workspace = true
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-tls = { workspace = true, optional = true }
claviron-types.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap = { workspace = true, optional = true }
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
pin-project-lite.workspace = true
tokio = { workspace = true, features = ["fs"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json = { workspace = true, optional = true }
# Regex patterns in static-route caching configuration.
serde_regex.workspace = true
serde_yaml = { workspace = true, optional = true }

# ── HTTP core ───────────────────────────────────────────────────────────
headers = { workspace = true, optional = true }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, optional = true }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }
tower.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
# RFC 6455 handshake digest; enabled only with HTTP/1 upgrades.
sha1 = { workspace = true, optional = true }

# ── TLS / certificates ──────────────────────────────────────────────────
rustls = { workspace = true, optional = true }

# ── Networking utilities ────────────────────────────────────────────────
ipnet.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── In-memory caching / concurrent maps ─────────────────────────────────
once_cell.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
byte-unit.workspace = true
bytes.workspace = true
regex.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive = { workspace = true, optional = true }

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
futures-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
hyper-util.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "authority"

[[test]]
name = "listener_snapshots"
required-features = ["server"]

[[test]]
name = "session"
required-features = ["server"]

[[test]]
name = "upgrade_lifecycle"
path = "tests/upgrade/lifecycle.rs"
required-features = ["websocket"]
