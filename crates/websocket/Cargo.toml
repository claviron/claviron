[package]
autotests = false
name = "claviron-websocket"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Listener-owned HTTP/1 WebSocket upgrade integration for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["claviron", "websocket", "http", "upgrade"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["axum", "server"] }
claviron-runtime.workspace = true
claviron-types.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
tokio.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
hyper.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
sha1.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http-body-util.workspace = true
hyper-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
tower.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
