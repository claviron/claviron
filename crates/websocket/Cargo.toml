[package]
autotests = false
name = "claviron-websocket"
version.workspace = true
publish.workspace = true
edition = "2024"
description = "Listener-owned HTTP/1 WebSocket upgrade integration for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["claviron", "websocket", "http", "upgrade"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

[dependencies]
# internal
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
claviron-http = { version = "0.2.0-alpha.17", path = "../http", features = ["axum", "server"] }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
claviron-types = { version = "0.2.0-alpha.17", path = "../types" }

# workspace
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
http.workspace = true
hyper.workspace = true
sha1.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hyper-util.workspace = true
http-body-util.workspace = true
serde_yaml.workspace = true
tower.workspace = true
tempfile = "3"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
