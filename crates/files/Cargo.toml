[package]
autotests = false
name = "claviron-files"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Static file serving, representation caching, and resource fallback for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["static-files", "http", "cache", "compression", "filesystem"]
categories = ["filesystem", "caching", "web-programming::http-server"]

[features]
default = []
tasks = ["dep:claviron-tasks"]
orbit = ["dep:claviron-orbit"]
axum = ["dep:axum", "claviron-http/axum"]
metrics = ["claviron-http/metrics"]
# Marker for facade-level cache builds. The current file service owns its
# in-crate memory/disk cache; shared claviron-cache integration will hang here.
cache = []

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-http.workspace = true
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-tasks = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
# HTTP date headers and conditional-request comparisons.
httpdate.workspace = true
percent-encoding.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── Crypto / hashing / encoding ─────────────────────────────────────────
blake3.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── In-memory caching / concurrent maps ─────────────────────────────────
dashmap.workspace = true
once_cell.workspace = true

# ── Compression / mime detection ────────────────────────────────────────
brotli.workspace = true
# Magic-byte MIME fallback for extensionless files.
infer.workspace = true
# Extension-based MIME fallback beyond the built-in fast map.
mime_guess.workspace = true
zstd.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
byte-unit.workspace = true
bytes.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
