[package]
name = "claviron-auth"
version.workspace = true
publish.workspace = true
edition.workspace= true
autotests = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
description = "Schema-independent authentication contracts for Claviron"
keywords = ["authentication", "identity", "session", "csrf", "security"]
categories = ["authentication", "asynchronous"]

[features]
csrf = ["dep:hmac", "dep:sha2", "dep:hex"]
orbit = ["dep:orbitive", "orbitive/auth"]

[dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
hex = { workspace = true, optional = true }
# Session-bound CSRF token signatures.
hmac = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

# ── Time / identifiers ──────────────────────────────────────────────────
time.workspace = true
uuid.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
continuo.workspace = true
orbitive = { workspace = true, optional = true }

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio.workspace = true

[[test]]
name = "orbit"
required-features = ["orbit"]
