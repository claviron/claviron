[package]
name = "claviron-auth"
version.workspace = true
publish.workspace = true
edition = "2024"
autotests = false
description = "Schema-independent authentication contracts for Claviron"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
include = ["/src/**/*.rs", "/README.md"]
keywords = ["claviron", "authentication", "identity", "session", "csrf"]
categories = ["authentication", "asynchronous"]

[features]
csrf = ["dep:hmac", "dep:sha2", "dep:hex"]
orbit = ["dep:orbitive", "orbitive/auth"]

[dependencies]
continuo.workspace = true
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
uuid.workspace = true
time.workspace = true
orbitive = { workspace = true, optional = true }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true

[[test]]
name = "orbit"
required-features = ["orbit"]
