[package]
autotests = false
name = "claviron-tasks"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Lifecycle-managed tasks, scheduling, and fleet dispatch for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["tasks", "scheduler", "background", "async", "cron"]
categories = ["asynchronous", "concurrency"]

[features]
metrics = ["claviron-runtime/metrics", "orbitive/metrics"]
# `log: { channel: <name> }`: task output as records in a declared log channel.
log-pipeline = ["dep:claviron-logging", "claviron-logging/pipeline"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-logging = { workspace = true, optional = true }
claviron-macros.workspace = true
claviron-orbit.workspace = true
claviron-runtime.workspace = true
claviron-sys.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive", "rc"] }
serde_yaml.workspace = true

# ── Crypto / hashing / encoding ─────────────────────────────────────────
blake3.workspace = true
fastrand.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
nix = { workspace = true, features = ["process", "signal"] }

# ── Time / identifiers ──────────────────────────────────────────────────
chrono.workspace = true
# Cron expressions and the Chrono timestamps required by their iterator.
cron.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true
# Collect task registrations emitted by #[task] across the linked binary.
inventory.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
dotenw.workspace = true
orbitive.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde_json.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
