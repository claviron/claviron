[package]
autotests = false
name = "claviron-hosting"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Hosting persistence, aliases, and certificate records for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["claviron", "hosting", "certificates", "virtual-hosts", "sqlx"]
categories = ["database", "web-programming::http-server"]

[features]
default = []
# Runtime/Provider integration — pulls AppState + DbService for HostingService.
server = [
    "dep:async-trait",
    "dep:claviron-runtime",
    "dep:claviron-db",
    "claviron-db/server",
    "dep:claviron-orbit",
    "dep:serde_json",
]

# Hosting data in an SQLite file (db.yaml `sqlite.hosting`) instead of
# PostgreSQL: the same tables, named `hosting_<table>`.
sqlite = ["sqlx/sqlite", "claviron-db?/sqlite", "dep:serde_json"]

postgres = ["sqlx/postgres", "claviron-db?/postgres"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-db = { workspace = true, optional = true }
claviron-orbit = { workspace = true, optional = true }
claviron-runtime = { workspace = true, optional = true }
claviron-types = { workspace = true, default-features = false }

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait = { workspace = true, optional = true }

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json = { workspace = true, optional = true }

# ── Database / cache backends ───────────────────────────────────────────
sqlx.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
time.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio.workspace = true
