[package]
autotests = false
name = "claviron-broadcast"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Realtime sessions, channel publication, and fleet fanout for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["broadcast", "pusher", "websocket", "realtime", "pubsub"]
categories = ["web-programming::websocket", "network-programming", "asynchronous", "concurrency"]

[features]
default = []
# Outbound HTTP compatibility for external Pusher servers.
pusher = ["claviron-pusher/axum"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-http = { workspace = true, features = ["websocket"] }
claviron-orbit.workspace = true
claviron-pusher.workspace = true
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
fastwebsockets.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
# Local RFC3339 timestamps for channel occupancy webhooks.
chrono.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive.workspace = true

[dev-dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-http = { workspace = true, features = ["axum", "server"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
tower.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "websocket"
path = "tests/websocket.rs"
