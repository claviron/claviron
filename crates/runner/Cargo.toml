[package]
autotests = false
name = "claviron-runner"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared HTTP and Orbit ingress, routing, and launch support for Claviron application runners"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["application-server", "runtime", "http", "async", "ipc"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
rust = []
# `register_router`: the application's axum router, the owner as its fallback.
axum = ["dep:axum", "claviron-http/axum", "claviron-pipeline/axum", "claviron-transport/axum"]
warp = ["dep:warp", "claviron-http/warp"]
# The application's TCP and Unix sockets.
socket = ["claviron-transport/tcp", "claviron-transport/websocket", "claviron-http/websocket"]
# The door with no socket: a lane an edge reaches over Orbit shared memory.
orbit = ["dep:claviron-orbit", "dep:claviron-app", "claviron-transport/orbit", "claviron-pipeline/orbit", "claviron-http/websocket"]
# HTTPS on the runner's TCP listener, optionally requiring a client certificate.
tls = ["socket", "claviron-transport/tls"]
# Explicit static mounts in front of the owner, from Claviron's file service.
files = []

# The launch's shared options from the command line.
cli = ["dep:clap"]
# Workers under Claviron's supervisor, and its section of the launch.
supervisor = ["dep:claviron-supervisor"]
# An owner's WebSocket, spoken with fastwebsockets on the runner's own sockets
# and as whole messages over Orbit when that door is built too.
websocket = ["socket", "claviron-transport/websocket-session"]
# Development's reload: native source notifications, the owner's reaction.
watch = ["dep:notify"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app = { workspace = true, optional = true }
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-pipeline.workspace = true
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-supervisor = { workspace = true, optional = true }
claviron-transport.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }

# ── Serialization & parsing ─────────────────────────────────────────────
clap = { workspace = true, features = ["derive"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }
warp = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"] }


# ── System / OS bindings ────────────────────────────────────────────────
notify = { version = "8.2", optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util"] }

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
