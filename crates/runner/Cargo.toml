[package]
autotests = false
name = "claviron-runner"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared HTTP and Orbit ingress, routing, and launch support for Claviron application runners"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["application-server", "runtime", "http", "claviron"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
# `register_router`: the application's axum router, the owner as its fallback.
axum = ["dep:axum", "claviron-http/routing"]
# HTTPS on the runner's TCP listener, optionally requiring a client certificate.
tls = ["dep:claviron-tls", "dep:rustls", "dep:thiserror", "dep:tokio-rustls"]
# Explicit static mounts in front of the owner, from Claviron's file service.
files = [
    "axum",
    "dep:claviron-files",
    "claviron-files/axum",
]

# Claviron's broadcasting in front of the owner, on the sockets and over Orbit.
broadcast = ["axum", "dep:claviron-broadcast", "dep:claviron-websocket"]
# The launch's shared options from the command line.
cli = ["dep:clap"]
# Workers under Claviron's supervisor, and its section of the launch.
supervisor = ["dep:claviron-supervisor"]
# An owner's WebSocket on the runner's own sockets, spoken with fastwebsockets.
websocket = ["dep:fastwebsockets"]
# Development's reload: native source notifications, the owner's reaction.
watch = ["dep:notify"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-broadcast = { workspace = true, optional = true }
claviron-files = { workspace = true, optional = true }
claviron-helpers.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-orbit.workspace = true
claviron-runtime.workspace = true
claviron-supervisor = { workspace = true, optional = true }
claviron-sys.workspace = true
claviron-tls = { workspace = true, optional = true }
claviron-websocket = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync"] }
tokio-util.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
clap = { workspace = true, features = ["derive"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
fastwebsockets = { workspace = true, features = ["upgrade"], optional = true }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio"] }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"] }

# ── TLS / certificates ──────────────────────────────────────────────────
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

# ── System / OS bindings ────────────────────────────────────────────────
notify = { version = "8.2", optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror = { workspace = true, optional = true }
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util"] }

# ── TLS / certificates ──────────────────────────────────────────────────
rcgen.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
