[package]
autotests = false
name = "claviron-edge"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Protocol-independent HTTP host admission, routing, and application dispatch for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "routing", "proxy", "php", "http3"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
rate-limit = ["server", "claviron-http/rate-limit", "dep:claviron-orbit", "claviron-orbit/quota"]
acme = ["claviron-http/acme"]
server = [
    "claviron-http/server",
    "dep:futures-util",
]
# Optional Rust application/router adapters; native host compilation is independent.
axum = [
    "server",
    "dep:axum",
    "dep:http-body",
    "claviron-http/routing",
    "claviron-files/axum",
    "claviron-pusher?/axum",
]
upstream = ["server", "dep:claviron-upstream"]
# One access record per request, to the log channel logging.yaml names.
access-log = [
    "server",
    "dep:claviron-logging",
    "claviron-logging/pipeline",
    "dep:http-body",
    "dep:http-body-util",
]
websocket = ["server", "claviron-http/websocket", "claviron-lua?/websocket", "dep:hyper"]

# Configured Pusher REST endpoints currently use an optional Rust router adapter.
broadcast = ["server", "axum", "dep:claviron-pusher", "websocket", "dep:claviron-broadcast", "claviron-broadcast/pusher"]

php = ["dep:claviron-php"]
php_fcgi = ["server", "php", "dep:claviron-php-fcgi", "claviron-php?/php_fcgi"]
php_embed = ["server", "php", "dep:claviron-php-embed", "claviron-php?/php_embed"]
lua = ["server", "dep:claviron-lua", "claviron-http/lua"]
# Native Link dispatch to an application process over Orbit shared memory.
orbit = [
    "claviron-http/orbit",
    "server",
    "dep:claviron-orbit",
    "dep:http-body-util",
    "dep:http-body",
    "dep:percent-encoding",
    "dep:tokio-util",
    # Edge owns the upgrade and protocol; Link carries whole messages.
    "claviron-http/websocket",
    "dep:hyper",
    "dep:hyper-util",
    "dep:fastwebsockets",
]
# A selected Lua runtime contributes its configured H1/H2 WebSocket endpoints.
# Weak forwarding must not select Lua for unrelated WebSocket users.
db = ["dep:claviron-db", "dep:claviron-hosting", "claviron-hosting/server"]
postgres = ["db", "claviron-db/postgres", "claviron-hosting/postgres"]
metrics = ["axum", "claviron-http/metrics"]
http3 = ["server", "claviron-http/http3"]
webtransport = ["http3", "dep:h3-quinn", "dep:h3-webtransport", "claviron-lua?/webtransport"]
# Native drivers are opt-in; host declarations alone open no sockets.
tcp = [
    "server", "claviron-types/ssl", "dep:claviron-sys",
    "dep:hyper", "dep:hyper-util", "dep:http-body-util",
    "dep:futures-util", "dep:socket2",
]
tls = ["dep:rustls", "dep:tokio-rustls"]
# Preserve the native H3 driver's existing WebTransport binding contract.
quic = [
    "http3", "webtransport", "claviron-types/ssl", "dep:claviron-sys",
    "dep:h3", "dep:quinn", "dep:quinn-deferred-config", "dep:rustls",
    "dep:futures-util", "dep:http-body", "dep:http-body-util",
]
geoip = ["dep:claviron-geoip"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-broadcast = { workspace = true, optional = true }
claviron-db = { workspace = true, default-features = true, optional = true, features = ["server"] }
claviron-files.workspace = true
claviron-geoip = { workspace = true, optional = true }
claviron-helpers.workspace = true
claviron-hosting = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-logging = { workspace = true, optional = true }
claviron-lua = { workspace = true, optional = true, features = ["app"] }
claviron-orbit = { workspace = true, optional = true }
claviron-php = { workspace = true, optional = true }
claviron-php-embed = { workspace = true, optional = true }
claviron-php-fcgi = { workspace = true, optional = true }
claviron-pusher = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-sys = { workspace = true, optional = true }
claviron-tls.workspace = true
claviron-types.workspace = true
claviron-upstream = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"], optional = true }

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
fastwebsockets = { workspace = true, optional = true }
http.workspace = true
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }
tower.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

# ── System / OS bindings ────────────────────────────────────────────────
socket2 = { workspace = true, optional = true }

# ── Networking utilities ────────────────────────────────────────────────
ipnet.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true
regex.workspace = true

# ── HTTP/3 (QUIC) ───────────────────────────────────────────────────────
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, features = ["datagram"], optional = true }
h3-webtransport = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
# Select each host's QUIC TLS configuration from its ClientHello SNI.
quinn-deferred-config = { workspace = true, optional = true }

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["test-util"] }

# ── HTTP core ───────────────────────────────────────────────────────────
h2 = "0.4"
http-body.workspace = true
http-body-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rcgen.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "authority"
path = "tests/authority.rs"

[[test]]
name = "deny"
path = "tests/deny.rs"

[[test]]
name = "provider"
path = "tests/provider.rs"

[[test]]
name = "sni"
path = "tests/sni.rs"
