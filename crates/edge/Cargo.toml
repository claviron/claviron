[package]
autotests = false
name = "claviron-edge"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "Protocol-independent HTTP host admission, routing, and application dispatch for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "routing", "proxy", "php", "http3"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
warp = ["claviron-http/warp"]
rate-limit = ["claviron-http/rate-limit", "dep:claviron-orbit", "claviron-orbit/quota"]
# Optional Rust application/router adapters; native host compilation is independent.
axum = [
    "dep:axum",
    "claviron-http/axum",
]
# One access record per request, to the log channel logging.yaml names.
access-log = [
    "dep:claviron-logging",
    "claviron-logging/pipeline",
]
websocket = ["tcp", "claviron-http/websocket"]
# Pure host declarations only; Broadcast owns its opt-in execution/session adapter.
# Native Link dispatch to an application process over Orbit shared memory.
orbit = [
    "claviron-http/orbit",
    "dep:claviron-orbit",
    "dep:percent-encoding",
    "tokio-util/io",
    # Edge owns the upgrade and protocol; Link carries whole messages.
    "claviron-http/websocket",
    "dep:fastwebsockets",
]
# A selected Lua runtime contributes its configured H1/H2 WebSocket endpoints.
# Weak forwarding must not select Lua for unrelated WebSocket users.
db = ["dep:claviron-db", "dep:claviron-hosting", "claviron-hosting/server"]
postgres = ["db", "claviron-db/postgres", "claviron-hosting/postgres"]
metrics = ["axum", "claviron-http/metrics"]
http3 = ["claviron-http/http3"]
webtransport = ["http3", "dep:h3-quinn", "dep:h3-webtransport"]
# What a transport's native drivers need from host selection. The drivers
# themselves live in claviron-transport; these open no sockets.
tcp = ["claviron-types/ssl", "dep:hyper", "dep:hyper-util"]
tls = ["dep:rustls"]
# The H3 driver always offers WebTransport sessions to the hosts that bind them.
quic = ["http3", "webtransport", "claviron-types/ssl"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-db = { workspace = true, default-features = true, optional = true, features = ["server"] }
claviron-files.workspace = true
claviron-helpers.workspace = true
claviron-hosting = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-logging = { workspace = true, optional = true }
claviron-orbit = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-tls.workspace = true
claviron-types.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

regex.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
fastwebsockets = { workspace = true, optional = true }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
percent-encoding = { workspace = true, optional = true }

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"] }

# ── TLS / certificates ──────────────────────────────────────────────────
rustls = { workspace = true, optional = true, features = ["std"] }

# ── Networking utilities ────────────────────────────────────────────────
ipnet = { workspace = true, features = ["serde"] }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

# ── HTTP/3 (QUIC) ───────────────────────────────────────────────────────
h3-quinn = { workspace = true, features = ["datagram"], optional = true }
h3-webtransport = { workspace = true, optional = true }

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }

# ── HTTP core ───────────────────────────────────────────────────────────
http-body.workspace = true
http-body-util.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum.workspace = true
warp.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"

[[test]]
name = "provider"
path = "tests/provider.rs"

[[test]]
name = "sni"
path = "tests/sni.rs"
