[package]
autotests = false
name = "claviron-transport"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "Socket acceptance and HTTP/1.1, HTTP/2 and HTTP/3 connection driving for Claviron, independent of host selection"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "http2", "http3", "quic", "server"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
# TCP bind, admission and drain; Hyper HTTP/1.1 settings and socket I/O.
tcp = ["dep:claviron-sys", "dep:hyper", "dep:hyper-util", "dep:socket2"]
# TLS accept, ALPN selection and HTTP/2 over TCP.
tls = [
    "tcp", "dep:claviron-tls", "dep:claviron-types", "claviron-types/ssl",
    "dep:tokio-rustls",
]
# HTTP/3 stream and connection handling over QUIC. The H3 error variants this
# reads are public only with the WebTransport crate selected, so the two go
# together.
quic = ["dep:h3", "dep:h3-webtransport"]
# Application-facing WebTransport sessions over the Quinn driver.
webtransport = ["quic", "dep:h3-quinn"]
# Fill a connection's country from the peer address.
geoip = ["dep:claviron-geoip"]
# Let an HTTP/1.1 connection be upgraded.
websocket = ["tcp"]
# Count accepted and open connections per listener.
metrics = ["claviron-http/metrics"]

[dependencies]
claviron-geoip = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-runtime.workspace = true
claviron-sys = { workspace = true, optional = true }
claviron-tls = { workspace = true, optional = true }
claviron-types = { workspace = true, optional = true }

arc-swap.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
socket2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }

h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, features = ["datagram"], optional = true }
h3-webtransport = { workspace = true, optional = true }

[dev-dependencies]
http.workspace = true
rcgen.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
