[package]
autotests = false
name = "claviron-transport"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "Socket acceptance and HTTP/1.1, HTTP/2 and HTTP/3 connection driving for Claviron, host-free or serving claviron-edge"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http", "http2", "http3", "quic", "server"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
# Serve Edge's virtual hosts. The only feature that brings Edge in; each
# driver below asks Edge for its side of that driver when both are selected.
edge = ["dep:claviron-edge", "pipeline", "dep:async-trait", "dep:serde", "dep:claviron-types"]
# A site compiled by claviron-pipeline as a listener's owner.
pipeline = ["dep:claviron-pipeline"]
# TCP bind, admission and drain; Hyper HTTP/1.1 settings and socket I/O.
tcp = [
    "dep:claviron-sys", "dep:hyper", "dep:hyper-util", "dep:socket2",
    "claviron-edge?/tcp",
]
# TLS accept, ALPN selection and HTTP/2 over TCP.
tls = [
    "tcp", "dep:claviron-tls", "dep:claviron-types", "claviron-types/ssl",
    "dep:rustls", "dep:tokio-rustls", "claviron-edge?/tls",
]
# HTTP/3 stream and connection handling over QUIC. The H3 error variants this
# reads are public only with the WebTransport crate selected, so the two go
# together.
quic = [
    "dep:h3", "dep:h3-webtransport", "dep:h3-quinn", "dep:quinn",
    "dep:quinn-deferred-config", "dep:rustls", "dep:claviron-sys",
    "dep:claviron-tls", "dep:claviron-types", "claviron-types/ssl",
    "claviron-http/http3", "claviron-edge?/quic",
]
webtransport = ["quic", "claviron-edge?/webtransport"]
# Fill a connection's country from the peer address.
geoip = ["dep:claviron-geoip"]
# Dispatch a host plan that is one Axum router without its extra layer.
axum = ["claviron-pipeline?/axum", "claviron-edge?/axum"]
# The door with no socket: an edge reaches this process's lane over Orbit.
orbit = ["dep:claviron-app", "dep:claviron-orbit", "dep:tokio-util"]
# Let an HTTP/1.1 connection be upgraded.
websocket = ["tcp", "claviron-edge?/websocket"]
# An owner's WebSocket spoken on the sockets, with whole messages like Link's.
websocket-session = ["websocket", "orbit", "dep:fastwebsockets"]
# Count accepted and open connections per listener.
metrics = ["claviron-http/metrics"]

[dependencies]
claviron-app = { workspace = true, optional = true }
claviron-edge = { workspace = true, optional = true }
claviron-geoip = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-orbit = { workspace = true, optional = true }
claviron-pipeline = { workspace = true, optional = true }
claviron-runtime.workspace = true
claviron-sys = { workspace = true, optional = true }
claviron-tls = { workspace = true, optional = true }
claviron-types = { workspace = true, optional = true }

arc-swap.workspace = true
async-trait = { workspace = true, optional = true }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["server-auto", "tokio"] }
serde = { workspace = true, optional = true, features = ["derive"] }
socket2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tokio-rustls = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

fastwebsockets = { workspace = true, optional = true, features = ["upgrade"] }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, features = ["datagram"], optional = true }
quinn = { workspace = true, optional = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-deferred-config = { workspace = true, optional = true, features = ["rustls-aws-lc-rs"] }
rustls = { workspace = true, optional = true, features = ["std"] }
h3-webtransport = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
orbitive = { workspace = true, features = ["rustls"] }
tokio-util.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
rcgen.workspace = true
tempfile = "3"
serde_yaml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "test-util", "time"] }
