[package]
autotests = false
name = "claviron-runtime"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Claviron runtime state, service lifecycle, configuration, and process-local events"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["runtime", "services", "lifecycle", "events", "async"]
categories = ["asynchronous", "concurrency"]

# NOTE: The generic composition kernel lives in `continuo`. This crate is
# Claviron-specific glue: AppState, run-mode metadata, env snapshotting, and
# the AppState-owned local callback dispatcher over Continuo's event primitive.

[features]
config-watch = ["continuo/config-watch"]
metrics = []

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-sys.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
congif.workspace = true
continuo.workspace = true
dotenw.workspace = true
orbitive.workspace = true

[[test]]
name = "env_scrub"
path = "tests/env_scrub.rs"

[[test]]
name = "events"
path = "tests/events.rs"
