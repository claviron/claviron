[package]
name = "claviron-symfony"
version.workspace = true
publish.workspace = true
edition.workspace= true
autotests = false
description = "Symfony integration package boundary for Claviron's embedded PHP runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "/src/**/*.rs",
    "/php/tests/**",
    "/README.md",
    "/php/composer.json",
    "/php/README.md",
    "/php/src/**/*.php",
    "/php/stubs/*.php",
]
keywords = ["symfony", "php", "application-server", "claviron"]
categories = ["web-programming::http-server"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-auth.workspace = true
claviron-broadcast.workspace = true
claviron-php-embed.workspace = true
claviron-pusher.workspace = true
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde_json.workspace = true

# ── PHP / FFI ───────────────────────────────────────────────────────────
ext-php-rs.workspace = true

[dev-dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-http.workspace = true
claviron-php = { workspace = true, features = ["php_embed"] }

# ── Async runtime & primitives ──────────────────────────────────────────
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body-util.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
tempfile = "3"
