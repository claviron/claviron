[package]
autotests = false
name = "claviron-module"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "Native modules: compiled libraries that register themselves as Claviron services and applications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["ffi", "module", "plugin", "http", "service"]
categories = ["development-tools::ffi", "web-programming::http-server"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-http = { workspace = true, features = ["server"] }
claviron-pipeline.workspace = true
claviron-runtime.workspace = true
continuo = { workspace = true, features = ["fleet"] }

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

# ── HTTP core ───────────────────────────────────────────────────────────
bytes.workspace = true
http.workspace = true
http-body.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }

# ── System / OS bindings ────────────────────────────────────────────────
libloading = "0.8"

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
