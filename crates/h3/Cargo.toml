[package]
autotests = false
name = "claviron-h3"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Native QUIC, HTTP/3, and WebTransport ingress for the Claviron edge"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["http3", "quic", "webtransport", "server", "claviron"]
categories = ["web-programming::http-server", "asynchronous", "network-programming"]

[features]
default = []
metrics = ["claviron-http/metrics"]

geoip = ["dep:claviron-geoip"]
[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-edge = { workspace = true, features = ["webtransport"] }
claviron-geoip = { workspace = true, optional = true }
claviron-http = { workspace = true, features = ["server"] }
claviron-runtime.workspace = true
claviron-sys.workspace = true
claviron-tls.workspace = true
claviron-types = { workspace = true, features = ["ssl"] }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rustls.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

# ── HTTP/3 (QUIC) ───────────────────────────────────────────────────────
h3.workspace = true
h3-quinn = { workspace = true, features = ["datagram"] }
h3-webtransport.workspace = true
quinn.workspace = true
# Select each host's QUIC TLS configuration from its ClientHello SNI.
quinn-deferred-config.workspace = true

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rcgen.workspace = true
