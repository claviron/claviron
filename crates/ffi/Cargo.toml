[package]
autotests = false
name = "claviron-ffi"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Foreign HTTP handler ABI, response types, and buffer ownership helpers for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["ffi", "http", "streaming", "bindings"]
categories = ["external-ffi-bindings", "web-programming::http-server"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-http = { workspace = true, optional = true }

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[features]
default = []
axum = ["dep:axum"]
http = ["dep:claviron-http", "claviron-http/axum"]
