[package]
autotests = false
name = "claviron-tls"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared certificate resolution, TLS policy, and mutual TLS configuration for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["tls", "mtls", "rustls", "certificates", "claviron"]
categories = ["cryptography", "network-programming"]

[features]

default = []
postgres = ["db", "claviron-db/postgres", "claviron-hosting/postgres"]
db = [
    "dep:claviron-hosting",
    "claviron-hosting/server",
    "dep:claviron-db",
    "claviron-db/server",
]

[dependencies]
#interanal
claviron-types = { version = "0.2.0-alpha.17", path = "../types", features = ["ssl"] }
claviron-runtime = { version = "0.2.0-alpha.17", path = "../runtime" }
claviron-helpers = { version = "0.2.0-alpha.17", path = "../helpers" }
claviron-orbit = { version = "0.2.0-alpha.17", path = "../orbit" }
claviron-hosting = { version = "0.2.0-alpha.17", path = "../hosting", optional = true }
claviron-db = { version = "0.2.0-alpha.17", path = "../db", optional = true }
# workspace
orbitive = { workspace = true, features = ["rustls"] }
x509-parser.workspace = true
rustls.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
arc-swap.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
