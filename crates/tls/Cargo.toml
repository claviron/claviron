[package]
autotests = false
name = "claviron-tls"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Shared certificate resolution, TLS policy, and mutual TLS configuration for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["tls", "mtls", "rustls", "certificates", "security"]
categories = ["cryptography", "network-programming"]

[features]

default = []
postgres = ["db", "claviron-db/postgres", "claviron-hosting/postgres"]
db = [
    "dep:claviron-hosting",
    "claviron-hosting/server",
    "dep:claviron-db",
    "claviron-db/server",
]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-db = { workspace = true, optional = true }
claviron-helpers.workspace = true
claviron-hosting = { workspace = true, optional = true }
claviron-orbit.workspace = true
claviron-runtime.workspace = true
claviron-types = { workspace = true, features = ["ssl"] }

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
tokio.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde.workspace = true
serde_json.workspace = true

# ── TLS / certificates ──────────────────────────────────────────────────
rustls.workspace = true
# X.509 certificate parsing for chain loading and mTLS identity checks.
x509-parser.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Published sibling libraries shared through workspace dependencies ───
orbitive = { workspace = true, features = ["rustls"] }

[dev-dependencies]
# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true
