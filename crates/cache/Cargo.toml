[package]
autotests = false
name = "claviron-cache"
version.workspace = true
publish.workspace = true
edition.workspace= true
description = "Named cache stores, typed values, and fleet-shared caching for Claviron"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["cache", "redis", "shared-memory", "async"]
categories = ["caching", "asynchronous", "concurrency"]

[features]
axum = ["dep:axum"]
redis = ["dep:redis", "dep:url"]

[lints.rust]
# Internal parking cfg only. Do not make this a Cargo feature: `--all-features`
# must not enable Redis TLS while redis/tokio-rustls resolves a rustls 0.23
# ClientConfig type.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(claviron_redis_tls_rustls_legacy)'] }

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-helpers.workspace = true
claviron-orbit.workspace = true
claviron-runtime.workspace = true

# ── Async runtime & primitives ──────────────────────────────────────────
arc-swap.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync"] }

# ── Serialization & parsing ─────────────────────────────────────────────
# Validated binary archives for composite cache values.
rkyv = { workspace = true, features = ["bytecheck", "little_endian", "pointer_width_32", "std", "unaligned"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
axum = { workspace = true, optional = true }

# ── Database / cache backends ───────────────────────────────────────────
# Content-addressed disk storage for the file cache driver.
cacache = { workspace = true, features = ["mmap", "tokio-runtime"] }
moka = { workspace = true, features = ["sync"] }
redis = { workspace = true, optional = true, features = ["connection-manager", "tokio-comp"] }

# ── Networking utilities ────────────────────────────────────────────────
url = { workspace = true, optional = true, features = ["serde"] }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── Misc utilities ──────────────────────────────────────────────────────
bytes.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt"] }

tempfile = "3"
