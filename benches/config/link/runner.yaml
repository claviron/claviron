# Resolved once for each isolated run; only one ingress is enabled.
requests: { max_body_size: off, body_read_timeout: off }
defaults:
  listener:
    execution: dedicated
    h1:
      header_read_timeout: null
    h2:
      max_concurrent_streams: 2147483647
      max_pending_accept_reset_streams: 1000000
      max_local_error_reset_streams: 1000000
