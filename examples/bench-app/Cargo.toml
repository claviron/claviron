[package]
name = "bench-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Rust workloads over Claviron Orbit Link and HTTP sockets"

[workspace]

[dependencies]
claviron = { path = "../..", default-features = false, features = ["runner", "runner-cli", "axum", "bench"] }
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"

[profile.dev]
codegen-units = 256
debug = 1
incremental = true
opt-level = 1
panic = "abort"
