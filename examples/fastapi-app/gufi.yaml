# How this application is deployed. The application's own code — routes,
# providers, services — knows none of it.
#
# One application, one file. Started with no arguments, gufi reads this one
# from beside the application; `--config <file>` names another, which is how
# the same application is run two ways.

# Match liberum/edge-server/config/vhost.yaml: Host: orbit.bench routes
# application fastapi-app through the fastapi fleet over shared memory.
# Start from the repository root with liberum/scripts/fastapi-app.sh --sync.
name: fastapi-app
icon: fastapi
fleet_name: fastapi
orbit: true

# One interpreter runs one thread of bytecode at a time, so Python scales by
# process. The master serves no traffic: it holds no lane and binds no socket.
workers: 4

# How that fleet is supervised. Every field has a built-in value, so this
# section carries only what this application disagrees with — here, one
# thing: a Python worker's memory is its own, and an interpreter that has
# been serving for two days is not the one that started.
supervisor:
  # Both triggers are off unless written. Rotation retires a worker between
  # requests; it is not a restart and not a failure.
  rotation:
    max_age: 48h
    rss_threshold: 1 GiB

  # Left to Claviron, and what it would say if asked:
  #
  #   startup.timeout      30s    a worker's first boot acknowledgement
  #   reload.timeout       5s
  #   shutdown.timeout     null   no deadline, and no SIGKILL
  #   monitor.interval     10s    health and rotation evaluation
  #   heartbeat            1s / 10s
  #   snapshot             1s / 5s
  #   metrics              10s / 30s
  #   recovery             10 attempts in 10m, 2s doubling to 60s
