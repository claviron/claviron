[package]
name = "edge-server"
version = "0.1.0"
publish = false
edition = "2024"
description = "Example Claviron edge for supervisor lifecycle scenarios."

# The benchmark composition declares Gufi transport hosts and upstream relays.
# The application and its workload remain separate processes.

[workspace]

[features]
default = ["bench"]
bench = ["claviron/upstream", "dep:serde"]

[dependencies]
claviron = { path = "../..", features = ["edge", "log-pipeline","lua"] }
clap = { version = "4.6", features = ["derive"] }
mimalloc = "0.1"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[[bin]]
name = "edge-server"
path = "src/main.rs"

# Matched to `claviron-full`, so a measurement taken against one is comparable
# with the other. An optimisation level that differs between two sides of a
# comparison makes the comparison say nothing.
[profile.dev]
codegen-units = 256
debug = 1
incremental = true
lto = false
opt-level = 1
panic = "abort"

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true
