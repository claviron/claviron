[package]
name = "fcgi-lifecycle"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
claviron = { path = "../..", default-features = false, features = ["php_fcgi", "runtime"] }
fastcgi-client = { version = "0.12", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
