[package]
name = "pentaglot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
claviron = { version = "0.2.0-alpha.23", default-features = false, features = ["edge", "lua", "php_embed", "logging"] }
claviron-deno = { version = "0.2.0-alpha.23", default-features = false, features = ["edge", "fetch"] }
gufi-asgi = { version = "0.2.0-alpha.24", default-features = false }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "unwind"
