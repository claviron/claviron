[package]
name = "claviron"
keywords = ["http", "runtime", "edge", "http3", "shared-memory"]
categories = ["web-programming::http-server", "asynchronous", "network-programming", "concurrency"]
description = "Build around your application. Run existing apps alongside Rust and move one route at a time."
authors.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["/src/**/*.rs", "/build.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
# Sections below are grouped by concern, alphabetised within each group.
# `crate?/feature` only enables the sub-feature if the dep is already
# active elsewhere — use it to avoid dragging optional crates in as a
# side effect (e.g. `cli` alone must not pull grpc/pubsub).

# ── Presets ──────────────────────────────────────────────────────────
default = []

# ── Core ─────────────────────────────────────────────────────────────
auth = ["dep:claviron-auth", "claviron-auth/csrf"]
users = ["auth", "claviron-auth/users"]
authorization = ["auth", "claviron-auth/authorization"]
application = ["runtime", "dep:claviron-app"]
clients = ["orbitive/client-pool", "dep:serde", "dep:humantime-serde"]
clients-fleet = ["clients", "orbitive/client-pool-fleet"]
http = ["runtime", "dep:claviron-http"]
pipeline = ["http", "dep:claviron-pipeline"]
transport = ["http", "dep:claviron-transport"]
# Bounded request-rate admission, independent of Axum and application engines.
rate-limit = ["http", "dep:claviron-orbit", "claviron-orbit/quota", "claviron-http/rate-limit", "claviron-edge?/rate-limit"]
axum = ["http", "claviron-http/axum", "dep:axum", "claviron-edge?/axum", "claviron-files?/axum", "claviron-pipeline?/axum", "claviron-transport?/axum"]
warp = ["http", "dep:warp", "claviron-http/warp", "claviron-edge?/warp"]
# Native benchmark handlers. Adapt existing compositions without selecting one.
bench = ["axum", "dep:serde", "dep:async-trait", "pipeline", "dep:claviron-types", "tokio/time"]
logging = ["dep:claviron-logging"]
# Declared log channels (logging.yaml): records buffered in an Orbit ring and
# written by one writer per fleet. See crates/logging/ARCHITECTURE.md.
log-pipeline = [
    "logging",
    "orbit",
    "claviron-logging/pipeline",
    "claviron-edge?/access-log",
    "claviron-tasks?/log-pipeline",
]
# The OTLP channel adapter (OpenTelemetry logs over OTLP/HTTP).
log-otlp = ["log-pipeline", "claviron-logging/otlp"]
runtime = ["dep:claviron-runtime"]
# Native configuration notifications for opt-in ConfigObserver owners.
# Independent of the runner's application-source watching.
config-watch = ["runtime", "claviron-runtime/config-watch"]
# LEGACY_LINUX: process handles on Linux kernels older than 5.3 (no pidfd).
legacy-linux = ["dep:claviron-sys", "claviron-sys/legacy-linux"]
orbit = [
    "claviron-http?/orbit",
    "claviron-auth?/orbit",
    "claviron-cache?/orbit",
    "dep:claviron-orbit",
    "claviron-files?/orbit",
    "claviron-edge?/orbit",
    "claviron-pipeline?/orbit",
    "claviron-transport?/orbit",
]
# Transport-neutral standalone application-server lifecycle. This deliberately
# excludes process supervision, HTTP listeners, edge dispatch, and static files.
server = [
    "application",
    "logging",
    "runtime",
    "orbit",
    "sys",
    "tokio/macros",
    "tokio/rt",
    "tokio/signal",
    "claviron-http?/server",
    "claviron-db?/server",
    "claviron-hosting?/server",
]
# Optional managed multi-process lifecycle. A supervised application can run
# standalone with zero workers or as a master/worker fleet.
supervisor = ["server", "dep:claviron-supervisor"]

# The supervised HTTP edge with native host routing and file serving.
# Select `axum` separately for Rust Axum applications.
edge = [
    "supervisor",
    "http",
    "files",
    "claviron-http/server",
    "dep:claviron-edge",
    "pipeline",
    "claviron-edge/tcp",
    "claviron-upstream?/edge",
    # Socket driving and named listener Runnables are transport-owned.
    "transport",
    "claviron-transport/tcp",
]

# Static assets can be served by an application without virtual hosts or edge dispatch.
files = ["dep:claviron-files"]

# ── Metrics extras
metrics = [
    "orbitive/metrics",
    "runtime",
    "claviron-runtime/metrics",
    "claviron-supervisor?/metrics",
    "claviron-edge?/metrics",
    "claviron-transport?/metrics",
    "claviron-http?/metrics",
    "claviron-upstream?/metrics",
    "claviron-files?/metrics",
    "claviron-tasks?/metrics",
]
# Native modules: compiled libraries `modules.yaml` lists, registering themselves
# as services and applications. Without that file, nothing is installed.
module = ["application", "server", "dep:claviron-module"]
# ── Protocols ────────────────────────────────────────────────────────
http3 = [
    "tls", "claviron-edge/quic", "dep:quinn",
    "transport", "claviron-transport/quic",
]
# DNS origins are always available; the application binds the resolver
# (`dyn ResolverFactory`, e.g. `resolver-hickory`). A hostname origin with no
# bound resolver is a boot error.
upstream = ["http", "dep:claviron-upstream", "resolver"]
resolver = ["dep:claviron-resolver"]
resolver-hickory = ["resolver", "claviron-resolver/hickory"]
# http connect extensions
websocket = ["claviron-http/websocket", "claviron-edge?/websocket", "claviron-transport?/websocket", "http"]
websocket-session = ["transport", "websocket", "claviron-transport/websocket-session"]
webtransport = ["edge", "http3", "claviron-edge/webtransport", "claviron-transport/webtransport"]

# ── TLS / SSL ────────────────────────────────────────────────────────
mtls = ["ssl"]
ssl = ["dep:claviron-types", "claviron-types/ssl"]
tls = ["ssl", "dep:claviron-tls", "claviron-edge?/tls", "claviron-transport?/tls"]

# ── Data ─────────────────────────────────────────────────────────────
cache = ["dep:claviron-cache", "claviron-cache/axum", "claviron-http?/cache", "claviron-files?/cache"]
db = ["dep:claviron-db", "dep:sqlx", "claviron-tls?/db"]
postgres = ["db", "claviron-db/postgres", "sqlx/postgres", "claviron-hosting?/postgres", "claviron-tls?/postgres", "claviron-edge?/postgres"]
mysql = ["db", "claviron-db/mysql", "sqlx/mysql"]
sqlite = ["db", "claviron-db/sqlite", "sqlx/sqlite", "claviron-hosting?/sqlite", "claviron-tls?/sqlite"]
redis = ["claviron-cache?/redis", "dep:redis"]

# ── Apps / services ──────────────────────────────────────────────────
# ── Hosting / domains ────────────────────────────────────────────────
# DB-managed vhost aliases and TLS certificates. This is an operational
# hosting mode, not the generic ability to open a database connection.
hosting = ["tls", "db", "dep:claviron-hosting", "claviron-edge?/db"]

# ── Misc ─────────────────────────────────────────────────────────────
geoip = ["dep:claviron-geoip", "claviron-transport?/geoip"]
tasks = ["dep:claviron-tasks", "dep:tokio-util", "claviron-files?/tasks"]
sys = ["dep:claviron-sys"]

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app = { workspace = true, optional = true }
claviron-auth = { workspace = true, optional = true }
claviron-cache = { workspace = true, optional = true }
claviron-db = { workspace = true, default-features = true, optional = true }
claviron-edge = { workspace = true, optional = true }
claviron-module = { workspace = true, optional = true }
claviron-files = { workspace = true, optional = true }
claviron-geoip = { workspace = true, optional = true }
claviron-helpers.workspace = true
claviron-hosting = { workspace = true, optional = true }
claviron-http = { workspace = true, optional = true }
claviron-logging = { workspace = true, optional = true }
claviron-orbit = { workspace = true, optional = true }
claviron-resolver = { workspace = true, optional = true }
claviron-runtime = { workspace = true, optional = true }
claviron-supervisor = { workspace = true, optional = true }
claviron-sys = { workspace = true, optional = true }
claviron-tasks = { workspace = true, optional = true }
claviron-pipeline = { workspace = true, optional = true }
claviron-tls = { workspace = true, optional = true }
claviron-transport = { workspace = true, optional = true }
claviron-types = { workspace = true, optional = true }
claviron-upstream = { workspace = true, optional = true }

# ── Async runtime & primitives ──────────────────────────────────────────
async-trait = { workspace = true, optional = true }
tokio.workspace = true
tokio-util = { workspace = true, optional = true, features = ["rt"] }

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

# ── Web framework (axum + tower) ────────────────────────────────────────
# Re-exported as `claviron::axum` so a consumer builds against the same axum
# this workspace resolves, instead of negotiating a version with it.
axum = { workspace = true, optional = true }
warp = { workspace = true, optional = true }

# ── Database / cache backends ───────────────────────────────────────────
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

# ── Time / identifiers ──────────────────────────────────────────────────
humantime-serde = { workspace = true, optional = true }
time = { workspace = true, features = ["formatting"] }

# ── Logging / errors / diagnostics ──────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true

# ── HTTP/3 (QUIC) ───────────────────────────────────────────────────────
quinn = { workspace = true, optional = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }

# ── Published sibling libraries shared through workspace dependencies ───
orbitive.workspace = true

[dev-dependencies]
# ── Async runtime & primitives ──────────────────────────────────────────
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# ── HTTP operation benchmarks ──────────────────────────────────────────
bytes.workspace = true
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
# TLS for the benchmark client and the native controls.
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio-rustls.workspace = true

# ── Time / identifiers ──────────────────────────────────────────────────
humantime.workspace = true
humantime-serde.workspace = true

# ── System / OS bindings ────────────────────────────────────────────────
libc.workspace = true

# ── Cache benchmarks ──────────────────────────────────────────────────
moka = { workspace = true, features = ["sync"] }

[[bench]]
name = "dispatch-edge-other"
path = "benches/dispatch/edge/other.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "dispatch-hyper"
path = "benches/dispatch/native/hyper.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "dispatch-axum"
path = "benches/dispatch/native/axum.rs"
harness = false
test = false
required-features = ["edge", "axum"]

[[bench]]
name = "dispatch-edge-axum"
path = "benches/dispatch/edge/axum.rs"
harness = false
test = false
required-features = ["edge", "axum"]

[[bench]]
name = "dispatch-edge-pipeline"
path = "benches/dispatch/edge/pipeline.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "dispatch-edge-json"
path = "benches/dispatch/edge/json.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "http1-hyper"
path = "benches/transport/http1/native/hyper.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "http1-axum"
path = "benches/transport/http1/native/axum.rs"
harness = false
test = false
required-features = ["edge", "axum"]

[[bench]]
name = "http1-plain-edge-other"
path = "benches/transport/http1/edge/other.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "http1-plain-edge-axum"
path = "benches/transport/http1/edge/axum.rs"
harness = false
test = false
required-features = ["edge", "axum"]

[[bench]]
name = "http1-plain-edge-routable"
path = "benches/transport/http1/edge/routable.rs"
harness = false
test = false
required-features = ["edge"]

[[bench]]
name = "http1-concurrent"
path = "benches/transport/http1/concurrent.rs"
harness = false
test = false
required-features = ["edge", "axum", "tls"]

[[bench]]
name = "link-selection"
path = "benches/transport/link/selection.rs"
harness = false
test = false
required-features = ["orbit"]

[[bench]]
name = "geoip-cache"
path = "benches/cache/geoip.rs"
harness = false
test = false
required-features = ["orbit"]

[workspace]
members = [
    "crates/app",
    "crates/auth",
    "crates/cache",
    "crates/db",
    "crates/edge",
    "crates/files",
    "crates/geoip",
    "crates/helpers",
    "crates/hosting",
    "crates/http",
    "crates/logging",
    "crates/macros",
    "crates/module",
    "crates/orbit",
    "crates/pipeline",
    "crates/resolver",
    "crates/runtime",
    "crates/supervisor",
    "crates/sys",
    "crates/tasks",
    "crates/tls",
    "crates/transport",
    "crates/types",
    "crates/upstream",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/claviron"
homepage = "https://github.com/claviron"
authors = ["ilker Arabaci <iadev09@claviron.dev>"]
include = ["/src/**/*.rs", "/build.rs", "/tests/**", "/examples/**", "/benches/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
publish = true

[workspace.dependencies]
# ─────────────────────────────────────────────────────────────────────
# Convention
# ─────────────────────────────────────────────────────────────────────
# Sections below are grouped by concern, alphabetised within each group.
# Crates pulled from `git = "..."` (no crates.io release we want, or
# unreleased fixes) live at the very bottom under `# Git sources`. The
# `[patch."..."]` table sits below dependencies and pins those git deps
# to our fork when needed — keep both in sync.

# ── Internal workspace crates ────────────────────────────────────────
claviron-app = { version = "0.2.1", path = "crates/app" }
claviron-auth = { version = "0.2.1", path = "crates/auth" }
claviron-cache = { version = "0.2.1", path = "crates/cache" }
claviron-db = { version = "0.2.1", path = "crates/db", default-features = false }
claviron-edge = { version = "0.2.1", path = "crates/edge" }
claviron-module = { version = "0.2.1", path = "crates/module" }
claviron-files = { version = "0.2.1", path = "crates/files" }
claviron-geoip = { version = "0.2.1", path = "crates/geoip" }
claviron-helpers = { version = "0.2.1", path = "crates/helpers" }
claviron-hosting = { version = "0.2.1", path = "crates/hosting" }
claviron-http = { version = "0.2.1", path = "crates/http" }
claviron-logging = { version = "0.2.1", path = "crates/logging" }
claviron-macros = { version = "0.2.1", path = "crates/macros" }
claviron-orbit = { version = "0.2.1", path = "crates/orbit" }
claviron-pipeline = { version = "0.2.1", path = "crates/pipeline" }
claviron-resolver = { version = "0.2.1", path = "crates/resolver", default-features = false }
claviron-runtime = { version = "0.2.1", path = "crates/runtime" }
claviron-supervisor = { version = "0.2.1", path = "crates/supervisor" }
claviron-sys = { version = "0.2.1", path = "crates/sys" }
claviron-tasks = { version = "0.2.1", path = "crates/tasks" }
claviron-tls = { version = "0.2.1", path = "crates/tls", default-features = false }
claviron-transport = { version = "0.2.1", path = "crates/transport" }
claviron-types = { version = "0.2.1", path = "crates/types", default-features = false }
claviron-upstream = { version = "0.2.1", path = "crates/upstream" }
# ── Async runtime & primitives ───────────────────────────────────────
arc-swap = "1.9"
async-trait = "0.1"
futures-util = "0.3"
pin-project-lite = "0.2"
tokio = "1"
tokio-util = "0.7"
# ── Serialization & parsing ──────────────────────────────────────────
rkyv = { version = "0.8.18", default-features = false }
clap = "4.6"
warp = { version = "0.4.3", default-features = false }
sync_wrapper = "1"
serde = "1"
serde_json = "1.0"
serde_regex = "1.1"
serde_yaml = "0.9"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
# ── Proc macros ─────────────────────────────────────────────────────
proc-macro2 = "1.0"
quote = "1.0"
syn = "3"
# ── HTTP core ────────────────────────────────────────────────────────
fastwebsockets = "0.10"
headers = "0.4"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
httpdate = "1"
hyper = "1.12"
hyper-util = "0.1"
percent-encoding = "2.3"
# ── Web framework (axum + tower) ─────────────────────────────────────
axum = "0.8"
tower = "0.5"
# ── TLS / certificates ───────────────────────────────────────────────
rcgen = "^0.14"
rustls = { version = "0.23", default-features = false }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
x509-parser = "0.18"
# ── Crypto / hashing / encoding ──────────────────────────────────────
base64ct = "1.8"
blake3 = "1.8"
fastrand = "2.4"
sha1 = "0.11.0"
# ── Database / cache backends ────────────────────────────────────────
# Keep Redis off its rustls feature; the default server profile does not need
# Redis TLS right now.
redis = "1.7"
sqlx = { version = "0.9", default-features = false }
cacache = { version = "13.1", default-features = false }
# ── System / OS bindings ─────────────────────────────────────────────
hostname = "0.4"
dirs = "7"
libc = "0.2"
nix = "0.31"
socket2 = "0.6"
# ── Networking utilities ─────────────────────────────────────────────
hickory-resolver = { version = "0.26.3", default-features = false }
ipnet = "2.12"
maxminddb = "0.32"
url = "2.5"
# ── Time / identifiers ───────────────────────────────────────────────
chrono = { version = "0.4", default-features = true } # used for tasks/cron only
cron = "0.17"
humantime = "2.3"
humantime-serde = "1"
time = "0.3"
uuid = "1.26"
# ── Logging / errors / diagnostics ───────────────────────────────────
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
thiserror = "2.0"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
# ── In-memory caching / concurrent maps ──────────────────────────────
dashmap = "6.1"
moka = "0.12"
once_cell = "1.21"
# ── Compression / mime detection ─────────────────────────────────────
brotli = "9"
infer = "0.22"
mime_guess = "2"
zstd = "0.14"
# ── Misc utilities ───────────────────────────────────────────────────
byte-unit = "5.2"
bytes = "1.11"
inventory = "0.3"
regex = "1.12"
# ── HTTP/3 (QUIC) ────────────────────────────────────────────────────
# Public Quinn stays on the released 0.11 line. `quinn-deferred-config`
# layers ClientHello-based ServerConfig selection on top until the
# upstream API lands.
quinn = { version = "0.11", default-features = false }
quinn-deferred-config = { version = "0.1", default-features = false }
# ─────────────────────────────────────────────────────────────────────
# H3 forks published on crates.io include the merged upstream fixes.
# Keep direct H3 consumers on the same fork family to share Rust types.
# Source and release policy: https://github.com/iadev09/h3
# ─────────────────────────────────────────────────────────────────────
h3 = { package = "h3-forked", version = "0.0.4" }
h3-quinn = { package = "h3-quinn-forked", version = "0.0.4" }
h3-webtransport = { package = "h3-webtransport-forked", version = "0.0.4" }
# ── Published sibling libraries shared through workspace dependencies ──
# Bounded state and shared-memory coordination across fleet processes.
orbitive = { version = "0.6.12", default-features = false }
# Typed service registry, lifecycle ordering and process-local events.
continuo = { version = "0.12.0", default-features = false }
# Typed configuration loading, composition and reload notifications.
congif = "0.0.1"
# Environment snapshots without changing process-global environment variables.
dotenw = { version = "0.0.1", default-features = false }

[profile.dev]
codegen-units = 256
debug = 1
incremental = true
lto = false
opt-level = 1
panic = "abort"

[profile.release]
# Optimize for speed
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
# Enable stripping of symbols to reduce binary size
#strip = "symbols"
strip = true
