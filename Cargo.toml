[package]
name = "claviron"
version.workspace = true
publish.workspace = true
edition = "2024"
keywords = ["application-server", "runtime", "http3", "embedded", "shared-memory"]
categories = ["web-programming::http-server", "asynchronous", "network-programming", "concurrency"]
authors = ["ilker Arabaci <iarabaci@claviron.dev>"]
description = "Embeddable Rust runtime and server fabric for fleet-aware application servers"
license.workspace = true
repository.workspace = true
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
# Sections below are grouped by concern, alphabetised within each group.
# `crate?/feature` only enables the sub-feature if the dep is already
# active elsewhere — use it to avoid dragging optional crates in as a
# side effect (e.g. `cli` alone must not pull grpc/pubsub).

# ── Presets ──────────────────────────────────────────────────────────
default = []

# ── Core ─────────────────────────────────────────────────────────────
auth = ["dep:claviron-auth", "claviron-auth/csrf", "claviron-php-embed?/auth"]
application = ["runtime", "dep:claviron-app"]
clients = ["orbitive/client-pool", "dep:serde", "dep:humantime-serde"]
clients-fleet = ["clients", "orbitive/client-pool-fleet"]
http = ["runtime", "dep:claviron-http"]
axum = ["http", "claviron-http/axum", "dep:axum", "claviron-php-embed?/axum", "claviron-runner?/axum"]
# Native benchmark handlers. Adapt existing compositions without selecting one.
bench = ["axum", "dep:claviron-bench"]
logging = ["dep:claviron-logging"]
# Declared log channels (logging.yaml): records buffered in an Orbit ring and
# written by one writer per fleet. See crates/logging/ARCHITECTURE.md.
log-pipeline = [
    "logging",
    "orbit",
    "claviron-logging/pipeline",
    "claviron-edge?/access-log",
    "claviron-php-embed?/log-pipeline",
    "claviron-tasks?/log-pipeline",
    "claviron-lua?/log",
]
# The OTLP channel adapter (OpenTelemetry logs over OTLP/HTTP).
log-otlp = ["log-pipeline", "claviron-logging/otlp"]
# The shared shell of a language runner: one application, its owner last.
# See crates/runner/ARCHITECTURE.md.
runner = ["server", "http", "dep:claviron-runner", "claviron-bench?/runner"]

# Development's reload for a runner: native source notifications.
runner-watch = ["runner", "claviron-runner/watch"]

# A runner launch's shared options from its command line.
runner-cli = ["runner", "claviron-runner/cli"]
# Lua 5.5 scripts in a fresh sandboxed state each; with `orbit`, the fleet's
# state as Lua modules, and with `tasks`, `lua:` tasks. See crates/lua/ARCHITECTURE.md.
lua = ["dep:claviron-lua", "claviron-lua/orbit", "claviron-lua/server", "claviron-lua/app", "claviron-edge?/lua", "claviron-http?/lua"]
# `claviron.fetch` for Lua scripts: HTTP out, to the hosts `lua.yaml` allows.
lua-fetch = ["lua", "claviron-lua/fetch"]

resolver = ["dep:claviron-resolver"]
resolver-hickory = ["resolver", "claviron-resolver/hickory"]
runtime = ["dep:claviron-runtime"]
# Native configuration notifications for opt-in ConfigObserver owners.
# Independent of the runner's application-source watching.
config-watch = ["runtime", "claviron-runtime/config-watch"]
# LEGACY_LINUX: process handles on Linux kernels older than 5.3 (no pidfd).
legacy-linux = ["dep:claviron-sys", "claviron-sys/legacy-linux"]
orbit = [
    "claviron-http?/orbit",
    "claviron-auth?/orbit",
    "dep:claviron-orbit",
    "claviron-files?/orbit",
    "claviron-edge?/orbit",
]
# Transport-neutral standalone application-server lifecycle. This deliberately
# excludes process supervision, HTTP listeners, edge dispatch, and static files.
server = [
    "application",
    "logging",
    "runtime",
    "orbit",
    "sys",
    "claviron-http?/server",
    "claviron-db?/server",
    "claviron-hosting?/server",
]
# Optional managed multi-process lifecycle. A supervised application can run
# standalone with zero workers or as a master/worker fleet.
supervisor = ["server", "dep:claviron-supervisor", "claviron-runner?/supervisor"]

# The supervised HTTP edge composition. This preserves the former `server`
# feature's cleartext H1/H2, host-routing, and file-serving surface.
edge = [
    "supervisor",
    "axum",
    "files",
    "claviron-http/server",
    "dep:claviron-hyper",
    "dep:claviron-edge",
    "claviron-edge/server",
    "claviron-edge/axum",
    "claviron-bench?/edge",
]

# Static assets can be served by an application without virtual hosts or edge dispatch.
files = ["dep:claviron-files", "claviron-runner?/files"]

# ── Metrics extras
metrics = [
    "dep:claviron-metrics",
    "claviron-supervisor?/metrics",
    "claviron-h3?/metrics",
    "claviron-hyper?/metrics",
    "claviron-http?/metrics",
    "claviron-upstream?/metrics",
    "claviron-files?/metrics",
    "claviron-php-fcgi?/metrics",
    "claviron-php-embed?/metrics",
    "claviron-tasks?/metrics",
]
http01 = ["claviron-hyper?/acme", "claviron-edge?/acme"]
ffi = ["dep:claviron-ffi"]
# ── Protocols ────────────────────────────────────────────────────────
http3 = [
    "tls",
    "dep:claviron-h3",
    "dep:quinn",
    "dep:quinn-deferred-config",
    "claviron-edge/http3",
]
# DNS origins are always available; the application binds the resolver
# (`dyn ResolverFactory`, e.g. `resolver-hickory`). A hostname origin with no
# bound resolver is a boot error.
upstream = ["dep:claviron-upstream", "claviron-edge?/upstream", "resolver"]
websocket = ["dep:claviron-websocket", "claviron-edge?/websocket", "claviron-edge?/websocket", "claviron-runner?/websocket", "claviron-lua?/websocket"]
webtransport = ["edge", "http3", "claviron-edge/webtransport"]
broadcast = ["websocket", "dep:claviron-broadcast", "claviron-edge?/broadcast", "claviron-runner?/broadcast"]

# ── TLS / SSL ────────────────────────────────────────────────────────
mtls = ["ssl"]
ssl = ["dep:claviron-types", "claviron-types/ssl"]
tls = ["ssl", "dep:claviron-tls", "claviron-hyper?/tls", "claviron-runner?/tls"]

# ── Data ─────────────────────────────────────────────────────────────
cache = ["dep:claviron-cache", "claviron-cache/axum", "claviron-http?/cache", "claviron-files?/cache", "claviron-php-embed?/cache"]
db = ["dep:claviron-db", "dep:sqlx", "claviron-tls?/db"]
postgres = ["db", "claviron-db/postgres", "sqlx/postgres", "claviron-php-embed?/postgres", "claviron-hosting?/postgres", "claviron-tls?/postgres", "claviron-edge?/postgres", "claviron-lua?/postgres"]
mysql = ["db", "claviron-db/mysql", "sqlx/mysql", "claviron-php-embed?/mysql", "claviron-lua?/mysql"]
sqlite = ["db", "claviron-db/sqlite", "sqlx/sqlite", "claviron-hosting?/sqlite", "claviron-lua?/sqlite"]
redis = ["claviron-cache?/redis", "dep:redis"]

# ── Apps / services ──────────────────────────────────────────────────
laravel = ["cache", "php_embed", "broadcast", "dep:claviron-laravel"]
symfony = ["cache", "php_embed", "broadcast", "dep:claviron-symfony"]
php = ["dep:claviron-php", "claviron-edge?/php"]
php_fcgi = ["php", "dep:claviron-php-fcgi", "claviron-php/php_fcgi", "claviron-edge/php_fcgi"]
# A PHP application server need not carry edge dispatch or virtual hosts.
php_embed = ["php", "dep:claviron-php-embed", "claviron-php/php_embed", "claviron-edge?/php_embed"]
# ── Hosting / domains ────────────────────────────────────────────────
# DB-managed vhost aliases and TLS certificates. This is an operational
# hosting mode, not the generic ability to open a database connection.
hosting = ["tls", "db", "dep:claviron-hosting", "claviron-hosting/server", "claviron-edge?/db"]

# ── Misc ─────────────────────────────────────────────────────────────
geoip = ["dep:claviron-geoip", "claviron-h3?/geoip", "claviron-hyper?/geoip"]
tasks = ["dep:claviron-tasks", "dep:tokio-util", "claviron-lua?/tasks", "claviron-files?/tasks", "claviron-php-fcgi?/tasks", "claviron-php-embed?/tasks"]
sys = ["dep:claviron-sys"]

[dependencies]
# ── Internal workspace crates ────────────────────────────────────────
claviron-app = { version = "0.2.0-alpha.17", path = "crates/app", optional = true }
claviron-auth = { version = "0.2.0-alpha.17", path = "crates/auth", optional = true }
claviron-bench = { version = "0.2.0-alpha.17", path = "crates/bench", optional = true }
claviron-broadcast = { version = "0.2.0-alpha.17", path = "crates/broadcast", optional = true }
claviron-cache = { version = "0.2.0-alpha.17", path = "crates/cache", optional = true }
claviron-db = { version = "0.2.0-alpha.17", path = "crates/db", optional = true }
claviron-edge = { version = "0.2.0-alpha.17", path = "crates/edge", optional = true }
claviron-ffi = { version = "0.2.0-alpha.17", path = "crates/ffi", features = ["http"], optional = true }
claviron-files = { version = "0.2.0-alpha.17", path = "crates/files", features = ["axum"], optional = true }
claviron-geoip = { version = "0.2.0-alpha.17", path = "crates/geoip", optional = true }
claviron-h3 = { version = "0.2.0-alpha.17", path = "crates/h3", optional = true }
claviron-helpers = { version = "0.2.0-alpha.17", path = "crates/helpers" }
claviron-hosting = { version = "0.2.0-alpha.17", path = "crates/hosting", optional = true }
claviron-http = { version = "0.2.0-alpha.17", path = "crates/http", optional = true }
claviron-hyper = { version = "0.2.0-alpha.17", path = "crates/hyper", optional = true, default-features = false }
claviron-laravel = { version = "0.2.0-alpha.17", path = "crates/laravel", optional = true }
claviron-logging = { version = "0.2.0-alpha.17", path = "crates/logging", optional = true }
claviron-lua = { version = "0.2.0-alpha.17", path = "crates/lua", optional = true }
claviron-metrics = { version = "0.2.0-alpha.17", path = "crates/metrics", optional = true }
claviron-orbit = { version = "0.2.0-alpha.17", path = "crates/orbit", optional = true }
claviron-php = { version = "0.2.0-alpha.17", path = "crates/php", optional = true }
claviron-php-embed = { version = "0.2.0-alpha.17", path = "crates/php-embed", optional = true }
claviron-php-fcgi = { version = "0.2.0-alpha.17", path = "crates/php-fcgi", optional = true, features = ["axum"] }
claviron-resolver = { version = "0.2.0-alpha.17", path = "crates/resolver", optional = true }
claviron-runner = { version = "0.2.0-alpha.17", path = "crates/runner", optional = true }
claviron-runtime = { version = "0.2.0-alpha.17", path = "crates/runtime", optional = true }
claviron-supervisor = { version = "0.2.0-alpha.17", path = "crates/supervisor", optional = true }
claviron-symfony = { version = "0.2.0-alpha.17", path = "crates/symfony", optional = true }
claviron-sys = { version = "0.2.0-alpha.17", path = "crates/sys", optional = true }
claviron-tasks = { version = "0.2.0-alpha.17", path = "crates/tasks", optional = true }
claviron-tls = { version = "0.2.0-alpha.17", path = "crates/tls", optional = true }
claviron-types = { version = "0.2.0-alpha.17", path = "crates/types", optional = true }
claviron-upstream = { version = "0.2.0-alpha.17", path = "crates/upstream", optional = true }
claviron-websocket = { version = "0.2.0-alpha.17", path = "crates/websocket", optional = true }

orbitive.workspace = true
# ── Workspace deps (always on) ───────────────────────────────────────
# Re-exported as `claviron::axum` so a consumer builds against the same axum
# this workspace resolves, instead of negotiating a version with it.
axum = { workspace = true, optional = true }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

# ── Workspace deps (feature-gated) ───────────────────────────────────
serde = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
quinn-deferred-config = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[workspace]
members = [
    "crates/app",
    "crates/auth",
    "crates/bench",
    "crates/broadcast",
    "crates/cache",
    "crates/db",
    "crates/edge",
    "crates/ffi",
    "crates/files",
    "crates/geoip",
    "crates/h3",
    "crates/helpers",
    "crates/hosting",
    "crates/http",
    "crates/hyper",
    "crates/laravel",
    "crates/logging",
    "crates/lua",
    "crates/macros",
    "crates/metrics",
    "crates/orbit",
    "crates/php",
    "crates/php-embed",
    "crates/php-fcgi",
    "crates/pusher",
    "crates/resolver",
    "crates/runner",
    "crates/runtime",
    "crates/supervisor",
    "crates/symfony",
    "crates/sys",
    "crates/tasks",
    "crates/tls",
    "crates/types",
    "crates/upstream",
    "crates/websocket",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.17"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/claviron"
authors = ["ilker Arabaci <iarabaci@claviron.dev>"]
# Pre-releases go to the claviron registry only; a final version is published to
# crates.io by hand, never by accident.
publish = true

[workspace.dependencies]
# ─────────────────────────────────────────────────────────────────────
# Convention
# ─────────────────────────────────────────────────────────────────────
# Sections below are grouped by concern, alphabetised within each group.
# Crates pulled from `git = "..."` (no crates.io release we want, or
# unreleased fixes) live at the very bottom under `# Git sources`. The
# `[patch."..."]` table sits below dependencies and pins those git deps
# to our fork when needed — keep both in sync.

# ── Async runtime & primitives ───────────────────────────────────────
arc-swap = "1.9"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
# ── Serialization & parsing ──────────────────────────────────────────
rkyv = { version = "0.8.18", default-features = false, features = [
    "bytecheck",
    "little_endian",
    "pointer_width_32",
    "std",
    "unaligned",
] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
serde_regex = "1.1"
serde_yaml = "0.9"
hex = "0.4"
hmac = "0.13"
md-5 = "0.11"
sha2 = "0.11"

# ── Proc macros ─────────────────────────────────────────────────────
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", features = ["full", "extra-traits"] }

# ── HTTP core ────────────────────────────────────────────────────────
fastwebsockets = "0.10"
headers = "0.4"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1.12", features = ["server", "http2", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2", "http1"] }
percent-encoding = "2.3"

# ── Web framework (axum + tower) ─────────────────────────────────────
axum = "0.8"
tower = { version = "0.5", features = ["timeout", "limit", "util"] }
tower-http = { version = "0.7", features = ["full"] }

# ── PHP / FFI ────────────────────────────────────────────────────────
fastcgi-client = { version = "0.12", features = ["tokio"] }
ext-php-rs = { version = "0.16", default-features = false, features = ["embed", "enum", "observer", "runtime", "smartstring"] }

# ── TLS / certificates ───────────────────────────────────────────────
rcgen = { version = "^0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
x509-parser = "0.18"

# ── Crypto / hashing / encoding ──────────────────────────────────────
base64ct = { version = "1.8", features = ["alloc"] }
blake3 = { version = "1.8" }
fastrand = "2.4"
sha1 = "0.11.0"

# ── Database / cache backends ────────────────────────────────────────
# Keep Redis off its rustls feature; the default server profile does not need
# Redis TLS right now.
redis = { version = "1.7", features = ["tokio-comp", "connection-manager", "aio", "streams"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "json",
    "uuid",
    "time",
    # Numeric/decimal round-trips in the PHP type layer.
    "bigdecimal",
] }
cacache = { version = "13.1", default-features = false, features = ["tokio-runtime", "mmap"] }

# ── System / OS bindings ─────────────────────────────────────────────
hostname = "0.4"
dirs = "7"
libc = "0.2"
nix = { version = "0.31", features = ["process", "signal", "user", "fs"] }
socket2 = "0.6"

# ── Networking utilities ─────────────────────────────────────────────
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
ipnet = { version = "2.12", features = ["serde"] }
maxminddb = "0.32"
url = { version = "2.5", features = ["serde"] }

# ── Time / identifiers ───────────────────────────────────────────────
chrono = { version = "0.4", default-features = true } # used for tasks/cron only
cron = "0.17"
humantime = "2.3"
humantime-serde = "1"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
uuid = { version = "1.26", features = ["serde", "v4"] }

# ── Logging / errors / diagnostics ───────────────────────────────────
thiserror = "2.0"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "fmt", "ansi"] }

# ── In-memory caching / concurrent maps ──────────────────────────────
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }
once_cell = "1.21"

# ── Compression / mime detection ─────────────────────────────────────
brotli = "9"
infer = "0.22"
mime_guess = "2"
zstd = "0.14"

# ── Misc utilities ───────────────────────────────────────────────────
byte-unit = { version = "5.2", features = ["serde"] }
bytes = "1.11"
inventory = "0.3"
regex = "1.12"

# ── HTTP/3 (QUIC) ────────────────────────────────────────────────────
# Public Quinn stays on the released 0.11 line. `quinn-deferred-config`
# layers ClientHello-based ServerConfig selection on top until the
# upstream API lands.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
quinn-deferred-config = { version = "0.1", default-features = false, features = ["rustls-aws-lc-rs"] }

# ─────────────────────────────────────────────────────────────────────
# H3 forks published on crates.io include the merged upstream fixes.
# Keep direct H3 consumers on the same fork family to share Rust types.
# Source and release policy: https://github.com/iadev09/h3
# ─────────────────────────────────────────────────────────────────────
h3 = { package = "h3-forked", version = "0.0.1" }
h3-quinn = { package = "h3-quinn-forked", version = "0.0.1" }
h3-webtransport = { package = "h3-webtransport-forked", version = "0.0.1" }

# ── Published sibling libraries shared through workspace dependencies ──
orbitive = { version = "0.5.5", default-features = false }
continuo = { version = "0.9.0", default-features = false, features = ["registry", "support", "events", "config", "fleet"] }
congif = { version = "0.0.1", features = ["yaml"] }
dotenw = { version = "0.0.1", default-features = false }

[profile.dev]
codegen-units = 256
debug = 1
incremental = true
lto = false
opt-level = 1
panic = "abort"

[profile.release]
# Optimize for speed
codegen-units = 1
debug = 0
incremental = false
lto = "thin"
opt-level = 3
panic = "unwind"
# Enable stripping of symbols to reduce binary size
#strip = "symbols"
strip = true
